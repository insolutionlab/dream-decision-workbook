<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전략적 의사결정 · 드림씨아이에스 PM·PL 과정 학습 워크북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #FFFFFF;
  --ink: #000000;
  --body: #1F1F1F;
  --mute: #595959;
  --band: #808080;
  --band-ink: #FFFFFF;
  --line: #000000;
  --hair: #D6D6D6;
  --wash: #F2F2F2;
  --field: #FAFAFA;
  --focus: #000000;
  --scrim: rgba(0,0,0,0.42);
  --pager-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161616; --ink: #F2F2F2; --body: #DCDCDC; --mute: #A6A6A6;
    --band: #5F5F5F; --band-ink: #FFFFFF; --line: #BFBFBF; --hair: #353535;
    --wash: #222222; --field: #1D1D1D; --focus: #FFFFFF; --scrim: rgba(0,0,0,0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161616; --ink: #F2F2F2; --body: #DCDCDC; --mute: #A6A6A6;
  --band: #5F5F5F; --band-ink: #FFFFFF; --line: #BFBFBF; --hair: #353535;
  --wash: #222222; --field: #1D1D1D; --focus: #FFFFFF; --scrim: rgba(0,0,0,0.6);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--body);
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 16px; line-height: 1.72; letter-spacing: -0.01em; word-break: keep-all;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* 상단 */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 8px; max-width: 760px; margin: 0 auto; padding: 8px 12px; }
.bar .name { flex: 1; font-weight: 700; font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; font-size: 14px; font-weight: 500; color: var(--ink); border: 1px solid var(--hair); }
.icon-btn:hover { border-color: var(--line); }
.icon-btn svg { width: 18px; height: 18px; }

/* 여정 레일 */
.rail { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 760px; margin: 0 auto; padding: 0 12px 10px; gap: 6px; }
.stage { text-align: left; padding: 4px 0 0; }
.stage .k { display: block; font-size: 12px; font-weight: 700; color: var(--mute); letter-spacing: 0.02em; }
.stage.on .k { color: var(--ink); }
.track { display: block; height: 5px; background: var(--hair); margin-top: 4px; position: relative; overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); transition: width .5s ease; }
.stage.on .track { outline: 1px solid var(--ink); outline-offset: 1px; }

/* 본문 */
main { max-width: 760px; margin: 0 auto; padding: 18px 16px calc(var(--pager-h) + 36px); }
.band { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; background: var(--band); color: var(--band-ink); padding: 10px 14px; }
.band .lb { font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em; }
.band .tag { font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,.7); padding: 0 6px; }
h2.utitle { font-size: 23px; line-height: 1.38; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; margin: 16px 0 14px; }
p { margin: 0 0 14px; }
p.lead { font-size: 17.5px; font-weight: 700; color: var(--ink); line-height: 1.55; margin-bottom: 16px; }
h3.sec { font-size: 17.5px; font-weight: 700; color: var(--ink); margin: 30px 0 14px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
ul.plain, ol.plain { margin: 0 0 14px; padding-left: 22px; }

/* 표 */
.tw { overflow-x: auto; margin: 0 0 18px; -webkit-overflow-scrolling: touch; }
table.grid { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.58; }
table.grid th, table.grid td { border: 1px solid var(--line); padding: 9px 11px; vertical-align: top; text-align: left; }
table.grid th { background: var(--band); color: var(--band-ink); font-weight: 700; font-size: 14px; text-align: center; }
table.grid td.lab { background: var(--band); color: var(--band-ink); font-weight: 700; font-size: 14px; text-align: center; vertical-align: middle; white-space: nowrap; }
table.grid td.dk { background: var(--ink); color: var(--paper); font-weight: 700; text-align: center; vertical-align: middle; white-space: nowrap; }
table.grid td.ctr { text-align: center; }
table.nostack { min-width: 540px; }
td.in { padding: 0; background: var(--field); }
td.in textarea { display: block; width: 100%; border: 0; background: transparent; padding: 10px 11px; min-height: 60px; }
td.in textarea:focus { outline: 2px solid var(--focus); outline-offset: -2px; }
td.chk { text-align: center; vertical-align: middle; padding: 6px; }
.cbox { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
.cbox input { width: 20px; height: 20px; accent-color: var(--ink); }

@media (max-width: 600px) {
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack thead { display: none; }
  table.stack tr { border: 1px solid var(--line); margin-bottom: 10px; }
  table.stack td { border: 0; border-top: 1px solid var(--hair); }
  table.stack td:first-child { border-top: 0; }
  table.stack td[data-label]::before { content: attr(data-label); display: block; font-size: 12.5px; font-weight: 700; color: var(--mute); margin-bottom: 3px; }
  table.stack td.in[data-label]::before { padding: 8px 11px 0; margin: 0; }
  table.stack td.lab, table.stack td.dk { text-align: left; white-space: normal; }
  table.stack td.lab[data-label]::before, table.stack td.dk[data-label]::before { color: rgba(255,255,255,.8); }
  table.stack td.ctr { text-align: left; }
  table.stack td.chk { text-align: left; padding: 8px 11px; }
  table.stack td.chk[data-label]::before { display: none; }
  table.stack td:empty { display: none; }
  table.nostack { min-width: 0; font-size: 13.5px; }
  table.nostack td { padding: 8px 8px; }
  table.nostack td.lab { white-space: normal; width: 64px; font-size: 12.5px; }
}

/* 박스 */
.box { border: 1px solid var(--line); padding: 14px 18px; margin: 0 0 18px; }
.box .bt { font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.box p:last-child { margin-bottom: 0; }
p.mdcode { font-family: ui-monospace, 'D2Coding', Menlo, Consolas, monospace; font-size: 14px; line-height: 1.7; white-space: normal; }
.read { border: 1px dashed var(--line); padding: 13px 16px; margin: 0 0 18px; font-size: 14.5px; line-height: 1.66; }
.read .rt { font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.read .rt::before { content: "읽어보기 · "; color: var(--mute); font-weight: 500; }
.read p:last-child, .read ul:last-child { margin-bottom: 0; }
.read ul { padding-left: 20px; margin: 0; }
.quote { margin: 0 0 18px; padding: 4px 0 4px 16px; border-left: 3px solid var(--ink); }
.quote p { font-weight: 500; color: var(--ink); margin-bottom: 4px; }
.quote .by { font-size: 13.5px; color: var(--mute); }
.refs p { font-size: 13px; line-height: 1.55; padding-left: 20px; text-indent: -20px; margin-bottom: 6px; }

/* 필기 */
.wrow { margin: 0 0 18px; }
.wcap { display: block; font-size: 14.5px; font-weight: 700; color: var(--ink); margin-bottom: 6px; line-height: 1.5; }
textarea {
  font: inherit; font-size: 15.5px; line-height: 1.6; color: var(--ink);
  resize: vertical; overflow: hidden;
}
textarea.w { width: 100%; border: 1px solid var(--line); background: var(--field); padding: 11px 13px; min-height: 96px; }
textarea::placeholder { color: var(--mute); opacity: .7; }

.src { border-top: 1px solid var(--hair); margin-top: 26px; padding-top: 8px; font-size: 12px; color: var(--mute); line-height: 1.5; }
.next-hint { margin-top: 18px; font-size: 14px; color: var(--mute); text-align: right; }

/* 하단 넘김 */
.pager {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.pager .in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; max-width: 760px; margin: 0 auto; height: var(--pager-h); padding: 0 12px; }
.nav { display: inline-flex; align-items: center; gap: 4px; padding: 10px 12px; font-weight: 700; font-size: 15px; color: var(--ink); }
.nav:disabled { opacity: .3; cursor: default; }
.nav svg { width: 18px; height: 18px; }
.nav.next { justify-self: end; background: var(--ink); color: var(--paper); }
.nav.prev { justify-self: start; }
.pos { text-align: center; font-size: 13px; color: var(--mute); line-height: 1.3; min-width: 96px; }
.pos b { color: var(--ink); font-size: 15px; }
.saved { display: block; font-size: 11.5px; height: 15px; opacity: 0; transition: opacity .25s; }
.saved.show { opacity: 1; }

/* 시작 화면 */
.hero h1 { font-size: 38px; line-height: 1.22; font-weight: 900; color: var(--ink); letter-spacing: -0.035em; margin: 18px 0 6px; }
.hero .sub { font-size: 20px; font-weight: 500; color: var(--ink); margin: 0 0 20px; }
.hero .intro { color: var(--body); }
.path { list-style: none; margin: 26px 0 26px; padding: 0; border-top: 2px solid var(--ink); }
.path li { border-bottom: 1px solid var(--line); }
.path button { width: 100%; display: grid; grid-template-columns: 88px 1fr auto; align-items: center; gap: 12px; padding: 14px 2px; text-align: left; }
.path .sk { font-size: 24px; font-weight: 900; color: var(--ink); letter-spacing: -0.02em; }
.path .sn { font-size: 15px; font-weight: 500; color: var(--body); line-height: 1.45; }
.path .sc { font-size: 13px; color: var(--mute); white-space: nowrap; text-align: right; }
.path .sc b { color: var(--ink); }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 30px; }
.btn { padding: 13px 20px; font-weight: 700; font-size: 15.5px; border: 1px solid var(--ink); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); }
.how ol { padding-left: 22px; }
.how li { margin-bottom: 10px; }
.credit { margin-top: 30px; padding-top: 12px; border-top: 1px solid var(--hair); font-size: 13.5px; color: var(--mute); line-height: 1.6; }
.credit b { color: var(--ink); }

/* 목차 패널 */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(88vw, 400px); z-index: 41;
  background: var(--paper); border-right: 1px solid var(--line);
  transform: translateX(-102%); transition: transform .24s ease; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 0 calc(env(safe-area-inset-bottom, 0px) + 24px);
}
.drawer.open { transform: none; }
.dh { display: flex; align-items: center; justify-content: space-between; padding: 0 14px 10px; border-bottom: 1px solid var(--line); }
.dh b { color: var(--ink); font-size: 16px; }
.grp { padding: 8px 0 4px; }
.grp .gh { display: flex; align-items: baseline; gap: 8px; background: var(--band); color: var(--band-ink); padding: 7px 14px; font-size: 13.5px; font-weight: 700; }
.grp .gh span { font-weight: 500; opacity: .9; }
.toc-item { width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: start; text-align: left; padding: 9px 14px; font-size: 14.5px; line-height: 1.45; border-bottom: 1px solid var(--hair); }
.toc-item .n { color: var(--mute); font-size: 13px; padding-top: 1px; }
.toc-item.cur { background: var(--wash); font-weight: 700; color: var(--ink); }
.toc-item .st { font-size: 12px; color: var(--mute); white-space: nowrap; padding-top: 2px; }
.toc-item .st.done { color: var(--ink); font-weight: 700; }

/* 기록 모아보기 */
.ans-unit { border-top: 1px solid var(--line); padding: 14px 0 6px; }
.ans-unit h3 { font-size: 16.5px; color: var(--ink); margin: 0 0 10px; }
.ans-unit h3 button { text-align: left; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.ans-f { margin: 0 0 12px; }
.ans-f .c { font-size: 13px; font-weight: 700; color: var(--mute); }
.ans-f .v { white-space: pre-wrap; color: var(--ink); }
.ans-f .v.empty { color: var(--mute); }
.tools { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 22px; }
.note { font-size: 13.5px; color: var(--mute); min-height: 20px; }
.meter { font-size: 15px; margin: 0 0 12px; }
.meter b { color: var(--ink); }

@media (min-width: 720px) {
  main { padding-top: 26px; }
  h2.utitle { font-size: 27px; }
  .hero h1 { font-size: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .fill, .drawer, .scrim, .saved { transition: none; }
}
@media print {
  .top, .pager, .drawer, .scrim { display: none !important; }
  main { padding-bottom: 0; }
}

/* 첨부2 아윤채 웹교재에서 가져온 것 · 남색 강조 · 단계 목록 · 복사 상자 */
:root { --accent: #001F7A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #7C9CFF; } }
.band { background: var(--accent) !important; }
.btn.primary { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
.fill { background: var(--accent) !important; }
ol.steps { list-style: none; counter-reset: st; padding: 0; margin: 14px 0 18px; }
ol.steps li { counter-increment: st; position: relative; padding: 10px 12px 10px 48px; border: 1px solid var(--hair); border-radius: 10px; margin-bottom: 8px; background: var(--field); }
ol.steps li::before { content: counter(st); position: absolute; left: 12px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
ol.steps li span { color: var(--mute); }
.cpy { border: 1px solid var(--hair); border-radius: 10px; margin: 16px 0; overflow: hidden; }
.cpy-h { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--wash); font-weight: 700; }
.cpy-b { padding: 4px 14px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-size: 14px; }
.cpy-b.done { background: var(--accent); color: #fff; }
pre.pbox { margin: 0; padding: 12px 14px; white-space: pre-wrap; word-break: keep-all; font-family: inherit; font-size: 15px; line-height: 1.7; background: var(--field); }
.wrow .cbox { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--hair); border-radius: 8px; }
.wrow .cbox input { margin-top: 6px; width: 18px; height: 18px; accent-color: var(--accent); }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <button class="icon-btn" id="btnToc" aria-label="목차 열기" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>목차
    </button>
    <button class="name" id="btnHome" style="text-align:left">전략적 의사결정 워크북</button>
    <button class="icon-btn" id="btnAns">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>나의 기록
    </button>
  </div>
  <nav class="rail" id="rail" aria-label="학습 단계"></nav>
</header>

<main id="view" tabindex="-1"></main>

<footer class="pager" id="pager">
  <div class="in">
    <button class="nav prev" id="btnPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>이전</button>
    <div class="pos" aria-live="polite"><span id="posTxt"></span><span class="saved" id="saved">자동 저장됨</span></div>
    <button class="nav next" id="btnNext">다음<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="목차" aria-hidden="true">
  <div class="dh"><b>목차</b><button class="icon-btn" id="btnClose">닫기</button></div>

<script type="application/json" id="wbdata">{"units": [{"no": 1, "part": 1, "key": "WHO", "practice": false, "title": "학습목표 세 가지와 오늘의 지도 5W", "plain": "학습목표 세 가지와 오늘의 지도 5W", "html": "<p class=\"lead\">이 과정의 학습목표 세 가지와 문제 해결 질문 다섯 가지 WHO·WHY·WHAT·HOW·GROW를 확인합니다.<\/p><p>이 과정은 CRO 프로젝트에서 제약 조건 아래에서 근거로 결정하고 합의하는 방법을 다루며, 학습목표는 셋입니다.<\/p><h3 class=\"sec\">학습목표 세 가지<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>학습목표<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"학습목표\">1 리스크를 줄이는 기준 기반 선택<\/td><td data-label=\"내용\">필수 조건과 비교 기준으로 대안의 장단점 설명과 선택<\/td><\/tr><tr><td class=\"lab\" data-label=\"학습목표\">2 근거와 조건으로 스폰서와 합의<\/td><td data-label=\"내용\">자료와 BATNA로 일정과 범위 요구 조율, 합의 조건 확인<\/td><\/tr><tr><td class=\"lab\" data-label=\"학습목표\">3 결정 이유와 다음 행동 기록<\/td><td data-label=\"내용\">결정 지점 분류표와 1 Page Report에 근거와 후속 행동 기록<\/td><\/tr><\/tbody><\/table><\/div><p>과정은 효율적·효과적 문제 해결을 위한 5W 질문의 차례로 진행됩니다.<\/p><h3 class=\"sec\">오늘의 지도 5W<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>질문<\/th><th>초점<\/th><th>묻는 것<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"질문\">WHO<\/td><td data-label=\"초점\">관점<\/td><td data-label=\"묻는 것\">누가 겪고 있는가<\/td><\/tr><tr><td class=\"lab\" data-label=\"질문\">WHY<\/td><td data-label=\"초점\">의미<\/td><td data-label=\"묻는 것\">무엇이 진짜 문제인가<\/td><\/tr><tr><td class=\"lab\" data-label=\"질문\">WHAT<\/td><td data-label=\"초점\">목표<\/td><td data-label=\"묻는 것\">어디로 가야 하는가<\/td><\/tr><tr><td class=\"lab\" data-label=\"질문\">HOW<\/td><td data-label=\"초점\">방법<\/td><td data-label=\"묻는 것\">어떻게 할 것인가<\/td><\/tr><tr><td class=\"lab\" data-label=\"질문\">GROW<\/td><td data-label=\"초점\">지속<\/td><td data-label=\"묻는 것\">무엇을 이어갈 것인가<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": []}, {"no": 2, "part": 1, "key": "WHO", "practice": true, "title": "내가 경험한 최고의 의사결정과 최악의 의사결정", "plain": "내가 경험한 최고의 의사결정과 최악의 의사결정", "html": "<p class=\"lead\">서로 만족하며 프로젝트를 성공적으로 이끈 의사결정 경험 하나와 가장 답답하고 힘들었던 의사결정 경험 하나를 적습니다.<\/p><div class=\"box\"><div class=\"bt\">두 가지 경험<\/div><p>최고의 의사결정: 서로 만족하며 성공적으로 프로젝트를 이끌어냈던 의사결정의 경험<br>최악의 의사결정: 가장 답답하고 힘들었던, 혹은 관계가 악화되었던 의사결정 혹은 업무 조율의 경험<\/p><\/div><div class=\"wrow\"><label class=\"wcap\">1. 서로 만족하며 프로젝트를 성공적으로 이끌어냈던 의사결정 경험 한 가지를 적습니다.<\/label><textarea class=\"w\" rows=\"3\" data-k=\"d001\" data-cap=\"1. 서로 만족하며 프로젝트를 성공적으로 이끌어냈던 의사결정 경험 한 가지를 적습니다.\" aria-label=\"1. 서로 만족하며 프로젝트를 성공적으로 이끌어냈던 의사결정 경험 한 가지를 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 가장 답답하고 힘들었거나 관계가 악화되었던 의사결정이나 업무 조율 경험 한 가지를 적습니다.<\/label><textarea class=\"w\" rows=\"3\" data-k=\"d002\" data-cap=\"2. 가장 답답하고 힘들었거나 관계가 악화되었던 의사결정이나 업무 조율 경험 한 가지를 적습니다.\" aria-label=\"2. 가장 답답하고 힘들었거나 관계가 악화되었던 의사결정이나 업무 조율 경험 한 가지를 적습니다.\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "d001", "cap": "1. 서로 만족하며 프로젝트를 성공적으로 이끌어냈던 의사결정 경험 한 가지를 적습니다."}, {"k": "d002", "cap": "2. 가장 답답하고 힘들었거나 관계가 악화되었던 의사결정이나 업무 조율 경험 한 가지를 적습니다."}]}, {"no": 3, "part": 1, "key": "WHO", "practice": true, "title": "CRO 프로젝트 의사결정의 네 가지 제약", "plain": "CRO 프로젝트 의사결정의 네 가지 제약", "html": "<p class=\"lead\">CRO 프로젝트의 의사결정은 제한된 자원·불확실성·이해관계자 충돌·규제 리스크의 네 제약 아래에서 이루어집니다.<\/p><p>CRO 프로젝트의 PM·PL은 인력·예산 제약, 임상시험 참여자 모집과 기관 승인 지연, 스폰서와 연구기관의 요구 충돌, GCP·ICH 지침·MFDS 규정 준수가 동시에 요구되는 상황에서 결정합니다.<\/p><h3 class=\"sec\">네 가지 제약과 업무 중에 대면하는 상황<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>제약<\/th><th>업무 중에 대면하는 상황<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"제약\">제한된 자원<\/td><td data-label=\"업무 중에 대면하는 상황\">인력·예산 제약<\/td><\/tr><tr><td class=\"lab\" data-label=\"제약\">불확실성<\/td><td data-label=\"업무 중에 대면하는 상황\">임상시험 참여자 모집과 기관 승인 지연<\/td><\/tr><tr><td class=\"lab\" data-label=\"제약\">이해관계자 충돌<\/td><td data-label=\"업무 중에 대면하는 상황\">스폰서와 연구기관의 요구 충돌<\/td><\/tr><tr><td class=\"lab\" data-label=\"제약\">규제 리스크<\/td><td data-label=\"업무 중에 대면하는 상황\">GCP·ICH 지침·MFDS 규정 준수<\/td><\/tr><\/tbody><\/table><\/div><p>지금 업무에서 가장 크게 느끼는 제약에 표시하고, 현재 수행 중인 업무 가운데 의사결정이 필요한 사안 하나를 적습니다.<\/p><div class=\"wrow\"><label class=\"cbox\"><input type=\"checkbox\" data-k=\"d003\" data-cap=\"1. 제한된 자원: 인력·예산 제약이 큽니다.\"><span>1. 제한된 자원: 인력·예산 제약이 큽니다.<\/span><\/label><\/div><div class=\"wrow\"><label class=\"cbox\"><input type=\"checkbox\" data-k=\"d004\" data-cap=\"2. 불확실성: 임상시험 참여자 모집과 기관 승인이 지연됩니다.\"><span>2. 불확실성: 임상시험 참여자 모집과 기관 승인이 지연됩니다.<\/span><\/label><\/div><div class=\"wrow\"><label class=\"cbox\"><input type=\"checkbox\" data-k=\"d005\" data-cap=\"3. 이해관계자 충돌: 스폰서와 연구기관의 요구가 충돌합니다.\"><span>3. 이해관계자 충돌: 스폰서와 연구기관의 요구가 충돌합니다.<\/span><\/label><\/div><div class=\"wrow\"><label class=\"cbox\"><input type=\"checkbox\" data-k=\"d006\" data-cap=\"4. 규제 리스크: GCP·ICH 지침·MFDS 규정 준수가 동시에 요구됩니다.\"><span>4. 규제 리스크: GCP·ICH 지침·MFDS 규정 준수가 동시에 요구됩니다.<\/span><\/label><\/div><div class=\"wrow\"><label class=\"wcap\">5. 현재 수행 중인 업무 가운데 의사결정이 필요한 사안 한 가지를 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d007\" data-cap=\"5. 현재 수행 중인 업무 가운데 의사결정이 필요한 사안 한 가지를 적습니다.\" aria-label=\"5. 현재 수행 중인 업무 가운데 의사결정이 필요한 사안 한 가지를 적습니다.\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "d003", "cap": "1. 제한된 자원: 인력·예산 제약이 큽니다."}, {"k": "d004", "cap": "2. 불확실성: 임상시험 참여자 모집과 기관 승인이 지연됩니다."}, {"k": "d005", "cap": "3. 이해관계자 충돌: 스폰서와 연구기관의 요구가 충돌합니다."}, {"k": "d006", "cap": "4. 규제 리스크: GCP·ICH 지침·MFDS 규정 준수가 동시에 요구됩니다."}, {"k": "d007", "cap": "5. 현재 수행 중인 업무 가운데 의사결정이 필요한 사안 한 가지를 적습니다."}]}, {"no": 4, "part": 1, "key": "WHO", "practice": false, "title": "프로젝트와 일상 업무, PM의 다섯 역할", "plain": "프로젝트와 일상 업무, PM의 다섯 역할", "html": "<p class=\"lead\">프로젝트와 일상 업무의 차이, 프로젝트 관리의 정의, PM의 다섯 역할을 확인합니다.<\/p><p>프로젝트(Project)는 고유한 제품, 서비스, 결과를 창출하기 위해 수행되는 한시적 노력입니다(PMBOK Guide 정의). 명확한 시작과 끝이 있고(한시적), 이전에 없던 새로운 결과물을 창출하며(고유한), 단계별로 구체화됩니다(점진적 구체화). 일상의 업무(Operations)는 지속적·반복적으로 수행하는 유지의 영역입니다. 프로젝트 관리(Project Management)는 프로젝트 요구사항을 만족시키기 위해 필요한 지식, 기술, 도구 및 기법을 프로젝트 활동에 적용하는 것입니다(Project Management Institute).<\/p><h3 class=\"sec\">프로젝트와 일상의 업무<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>프로젝트(Project)<\/th><th>일상의 업무(Operations)<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">영역<\/td><td data-label=\"프로젝트(Project)\">개선과 변화의 영역<\/td><td data-label=\"일상의 업무(Operations)\">유지의 영역<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">수행 방식<\/td><td data-label=\"프로젝트(Project)\">한시적으로 고유한 가치 창출<\/td><td data-label=\"일상의 업무(Operations)\">지속적·반복적 수행<\/td><\/tr><\/tbody><\/table><\/div><p>PM/PL의 역할은 관리자를 넘어 성과 설계자로 확장됩니다. 무엇을 왜 하는가(명확한 목표와 범위 설정), 누가 얼마나 필요한가(인력·예산·시간 확보)를 정하고, 목표 달성과 명확한 결과 보고를 맡습니다. PMBOK Guide에 따른 PM의 역할은 다섯입니다.<\/p><h3 class=\"sec\">PM의 5 역할<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>역할<\/th><th>하는 일<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"역할\">계획자(Planner)<\/td><td data-label=\"하는 일\">무엇을, 언제, 누가, 어떻게 할지 설계<\/td><\/tr><tr><td class=\"lab\" data-label=\"역할\">조정자(Coordinator)<\/td><td data-label=\"하는 일\">자원(인력, 예산, 시간)의 효율적 배분<\/td><\/tr><tr><td class=\"lab\" data-label=\"역할\">의사소통자(Communicator)<\/td><td data-label=\"하는 일\">이해관계자 간 정보 흐름 관리<\/td><\/tr><tr><td class=\"lab\" data-label=\"역할\">통제자(Controller)<\/td><td data-label=\"하는 일\">진행 상황 모니터링과 리스크 관리<\/td><\/tr><tr><td class=\"lab\" data-label=\"역할\">리더(Leader)<\/td><td data-label=\"하는 일\">팀 동기부여와 목표 달성 주도<\/td><\/tr><\/tbody><\/table><\/div>", "source": "Project Management Institute. (2021). A guide to the project management body of knowledge (PMBOK guide) (7th ed.). PMI.", "bridge": "", "fields": []}, {"no": 5, "part": 2, "key": "WHY", "practice": false, "title": "문제는 지금 상태와 원하는 상태의 차이 · AS-IS · GAP · TO-BE와 통제 범위", "plain": "문제는 지금 상태와 원하는 상태의 차이 · AS-IS · GAP · TO-BE와 통제 범위", "html": "<p class=\"lead\">문제는 지금 상태(AS-IS)와 원하는 상태(TO-BE) 사이의 차이(GAP)이고, 문제 정의는 그 차이를 문장으로 고정하는 작업입니다.<\/p><p>문제는 지금 상태와 원하는 상태 사이의 거리이며, 이 거리를 줄이는 일이 문제해결입니다. 지금 상태는 있는 그대로의 사실이고, 원하는 상태는 도달하고 싶은 지점입니다. 원하는 상태를 적지 않으면 지금 상태가 문제인지 알 수 없고, 차이를 특정하지 못한 상태에서는 어떤 해법도 검증되지 않습니다.<\/p><h3 class=\"sec\">AS-IS · GAP · TO-BE<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>뜻<\/th><th>근거와 기준<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">AS-IS 현재 상태<\/td><td data-label=\"뜻\">관찰과 인터뷰로 확인된 지금의 절차와 결과<\/td><td data-label=\"근거와 기준\">수집한 기록<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">GAP 차이<\/td><td data-label=\"뜻\">두 상태 사이에서 실제로 해소해야 할 구간<\/td><td data-label=\"근거와 기준\">이 구간을 특정한 문장이 문제 정의문<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">TO-BE 목표 상태<\/td><td data-label=\"뜻\">달성했다고 판단할 기준의 구체적 기술<\/td><td data-label=\"근거와 기준\">기준이 없으면 해결 여부 확인 불가<\/td><\/tr><\/tbody><\/table><\/div><p>문제를 다룰 때는 통제할 수 있는 것에만 집중합니다. 통제 가능성과 행동 여부가 만나는 자리에서 의미 있는 실행이 연결됩니다.<\/p><h3 class=\"sec\">통제 범위와 행동 여부<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>행동<\/th><th>행동 없음<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">통제 가능<\/td><td data-label=\"행동\">성찰로 성과를 만들고 성장이 이어짐(성과·성장·성숙)<\/td><td data-label=\"행동 없음\">할 수 있는데도 손을 놓음(포기)<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">통제 불가<\/td><td data-label=\"행동\">바꿀 수 없는 것에 힘만 쏟음(좌절과 분노)<\/td><td data-label=\"행동 없음\">바꿀 수 없음을 인정하고 내려놓음(안도감)<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": []}, {"no": 6, "part": 2, "key": "WHY", "practice": true, "title": "문제 문장 쓰기 · 현상 · 영향 · 기한", "plain": "문제 문장 쓰기 · 현상 · 영향 · 기한", "html": "<p class=\"lead\">문제 문장은 현상·영향·기한의 세 요소를 담고, 정의문은 「나는 [언제] [무엇] 때문에 [어떤 손실]을 겪고 있으며 원인은 [무엇]이다」의 틀로 씁니다.<\/p><p>문제 문장은 현상·영향·기한의 세 요소를 담아 문제의 범위와 해결 시한을 확정합니다. 정의문은 현상 + 영향 + 원인으로 구성하며, 문장 틀은 「나는 [언제] [무엇] 때문에 [어떤 손실]을 겪고 있으며 원인은 [무엇]이다」입니다. 예를 들어 「매달 말일에(언제) 자료를 세 곳에서 따로 받기 때문에(무엇 때문에) 이틀씩 야근을 하고 있다(어떤 손실)」처럼 씁니다.<\/p><h3 class=\"sec\">사례 · 임상시험 참여자 모집 부진의 문제 정의<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구성 요소<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구성 요소\">현상<\/td><td data-label=\"내용\">임상시험 참여자 모집 부진<\/td><\/tr><tr><td class=\"lab\" data-label=\"구성 요소\">영향 선택지<\/td><td data-label=\"내용\">① 착수 일정 지연 ② 프로젝트 전체·계약·수익성 영향<\/td><\/tr><tr><td class=\"lab\" data-label=\"구성 요소\">기한 선택지<\/td><td data-label=\"내용\">① 다음 주 월요일 ② 3일 이내<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">정의문의 조건 셋<\/div><p>구체적: 언제 어디서 발생 가능한/발생한 일인가<br>측정 가능하게: 횟수나 시간이나 금액 등 측정 기준이 있는가<br>실행 가능하게: 실천 방안과 연결되는가<br>추상적인 단어가 남아 있으면 의사결정의 기준과 실행 방안도 모호해집니다.<\/p><\/div><div class=\"wrow\"><label class=\"wcap\">1. 지금 업무에서 겪고 있는 문제의 현상을 한 줄로 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d008\" data-cap=\"1. 지금 업무에서 겪고 있는 문제의 현상을 한 줄로 적습니다.\" aria-label=\"1. 지금 업무에서 겪고 있는 문제의 현상을 한 줄로 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 그 현상이 주는 영향과 해결 기한을 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d009\" data-cap=\"2. 그 현상이 주는 영향과 해결 기한을 적습니다.\" aria-label=\"2. 그 현상이 주는 영향과 해결 기한을 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">3. 「나는 [언제] [무엇] 때문에 [어떤 손실]을 겪고 있으며 원인은 [무엇]이다」의 틀로 문제 문장 한 줄을 적습니다.<\/label><textarea class=\"w\" rows=\"3\" data-k=\"d010\" data-cap=\"3. 「나는 [언제] [무엇] 때문에 [어떤 손실]을 겪고 있으며 원인은 [무엇]이다」의 틀로 문제 문장 한 줄을 적습니다.\" aria-label=\"3. 「나는 [언제] [무엇] 때문에 [어떤 손실]을 겪고 있으며 원인은 [무엇]이다」의 틀로 문제 문장 한 줄을 적습니다.\"><\/textarea><\/div>", "source": "Doran, G. T. (1981). There&#x27;s a S.M.A.R.T. way to write management&#x27;s goals and objectives. Management Review, 70(11), 35-36.", "bridge": "", "fields": [{"k": "d008", "cap": "1. 지금 업무에서 겪고 있는 문제의 현상을 한 줄로 적습니다."}, {"k": "d009", "cap": "2. 그 현상이 주는 영향과 해결 기한을 적습니다."}, {"k": "d010", "cap": "3. 「나는 [언제] [무엇] 때문에 [어떤 손실]을 겪고 있으며 원인은 [무엇]이다」의 틀로 문제 문장 한 줄을 적습니다."}]}, {"no": 7, "part": 2, "key": "WHY", "practice": true, "title": "확인된 사실 · 확인할 사실 · 필수 조건과 원인 검증", "plain": "확인된 사실 · 확인할 사실 · 필수 조건과 원인 검증", "html": "<p class=\"lead\">의사결정은 확인된 사실, 확인할 사실, 필수 조건을 나누어 적는 데서 출발하고, 추정 원인은 검증 자료로 확인합니다.<\/p><p>사안을 다룰 때는 알고 있는 것부터 분리합니다. 확인된 사실, 아직 확인할 사실, 어떤 경우에도 지켜야 할 필수 조건을 나누어 적고, 사실이 부족하면 확인 담당자와 확인 기한을 지정합니다. 관찰된 현상에 대해 추정한 원인은 가설이므로 검증 자료로 확인합니다.<\/p><h3 class=\"sec\">예 · 등록 지연<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>항목<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"항목\">사안<\/td><td data-label=\"예\">등록 지연<\/td><\/tr><tr><td class=\"lab\" data-label=\"항목\">확인된 사실<\/td><td data-label=\"예\">일부 사이트의 등록이 계획보다 늦음<\/td><\/tr><tr><td class=\"lab\" data-label=\"항목\">확인할 사실<\/td><td data-label=\"예\">지연 원인<\/td><\/tr><tr><td class=\"lab\" data-label=\"항목\">필수 조건<\/td><td data-label=\"예\">임상시험 참여자 안전, 데이터 무결성<\/td><\/tr><tr><td class=\"lab\" data-label=\"항목\">사실 부족 시<\/td><td data-label=\"예\">확인 담당자와 확인 기한 지정<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">원인 검증 · 현상 · 추정 원인 · 검증 자료<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>관찰된 현상<\/th><th>추정 원인<\/th><th>검증 자료<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"관찰된 현상\">임상시험 참여자 모집 부진<\/td><td data-label=\"추정 원인\">특정 포함·제외 기준과 현장 여건의 불일치<\/td><td data-label=\"검증 자료\">기관별 스크리닝 탈락 사유와 그 분포<\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">1. 다루고 있는 사안 하나와 확인된 사실을 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d011\" data-cap=\"1. 다루고 있는 사안 하나와 확인된 사실을 적습니다.\" aria-label=\"1. 다루고 있는 사안 하나와 확인된 사실을 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 아직 확인할 사실(추정 원인)과 그것을 확인할 자료·담당자·기한을 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d012\" data-cap=\"2. 아직 확인할 사실(추정 원인)과 그것을 확인할 자료·담당자·기한을 적습니다.\" aria-label=\"2. 아직 확인할 사실(추정 원인)과 그것을 확인할 자료·담당자·기한을 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">3. 그 사안에서 어떤 경우에도 지켜야 할 필수 조건을 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d013\" data-cap=\"3. 그 사안에서 어떤 경우에도 지켜야 할 필수 조건을 적습니다.\" aria-label=\"3. 그 사안에서 어떤 경우에도 지켜야 할 필수 조건을 적습니다.\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "d011", "cap": "1. 다루고 있는 사안 하나와 확인된 사실을 적습니다."}, {"k": "d012", "cap": "2. 아직 확인할 사실(추정 원인)과 그것을 확인할 자료·담당자·기한을 적습니다."}, {"k": "d013", "cap": "3. 그 사안에서 어떤 경우에도 지켜야 할 필수 조건을 적습니다."}]}, {"no": 8, "part": 2, "key": "WHY", "practice": false, "title": "발생형 문제와 설정형 문제, 운영적 결정과 전략적 결정", "plain": "발생형 문제와 설정형 문제, 운영적 결정과 전략적 결정", "html": "<p class=\"lead\">문제는 이미 발생한 발생형 문제와 아직 발생하지 않은 리스크인 설정형 문제로, 결정은 운영적 결정과 전략적 결정으로 구분합니다.<\/p><p>발생형 문제는 이미 발생한 문제이며 「지금 무엇을 막아야 하는가」를 묻습니다. 등록 지연, 승인 지연, 쿼리 증가가 이에 해당하고, 피해 확산 억제, 원인 확인, 복구 방법 선정의 차례로 대응합니다. 설정형 문제는 아직 발생하지 않은 리스크이며 「무엇을 미리 준비할 수 있는가」를 묻습니다. 예상 리스크, 징후, 준비 행동의 차례로 플랜 B와 전환 기준을 마련하고, 가정 수립, 시나리오 설계, 리스크 평가, 플랜 B의 흐름으로 다룹니다. 6개월 뒤 경쟁 임상 약 진입에 대비한 상위 20% 기관의 환자 등록 풀 선제적 확보가 그 예입니다.<\/p><h3 class=\"sec\">발생형 문제와 설정형 문제<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>발생형 문제<\/th><th>설정형 문제<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">대상<\/td><td data-label=\"발생형 문제\">이미 발생한 문제<\/td><td data-label=\"설정형 문제\">아직 발생하지 않은 리스크<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">묻는 것<\/td><td data-label=\"발생형 문제\">지금 무엇을 막아야 하는가<\/td><td data-label=\"설정형 문제\">무엇을 미리 준비할 수 있는가<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">순서<\/td><td data-label=\"발생형 문제\">피해 확산 억제 · 원인 확인 · 복구 방법 선정<\/td><td data-label=\"설정형 문제\">예상 리스크 · 징후 · 준비 행동<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">예<\/td><td data-label=\"발생형 문제\">IRB 승인 지연 · 현재 영향 착수 일정 지연 · 우선 조치 승인 예정일 확인<\/td><td data-label=\"설정형 문제\">등록 속도 하락 · 2주 연속 목표 미달 · 추가 사이트 검토<\/td><\/tr><\/tbody><\/table><\/div><p>운영적 결정은 정해진 절차 안의 업무 처리 판단이며 절차·책임자·처리 기한을 확인합니다. 전략적 결정은 일정·비용·범위·수익성에 장기적 영향을 미치는 판단이며 대안·영향·승인 경로를 확인합니다. 국가 추가, 계약 변경, 인력 재배치가 전략적 결정의 예입니다. 둘은 가역성, 영향 범위, 의사결정자, 시간 압박, 오류 비용의 다섯 기준으로 구분하며, 판단 원칙은 명칭보다 영향의 크기 우선입니다.<\/p><h3 class=\"sec\">예 · 등록 저조 기관의 조기 철수 판정<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분 기준<\/th><th>판정 내용<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분 기준\">결정 사안<\/td><td data-label=\"판정 내용\">등록 저조 기관의 조기 철수 여부<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분 기준\">가역성<\/td><td data-label=\"판정 내용\">비가역적<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분 기준\">영향 범위<\/td><td data-label=\"판정 내용\">프로젝트 전체·계약·수익성<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분 기준\">의사결정자<\/td><td data-label=\"판정 내용\">스폰서·경영진<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분 기준\">시간 압박<\/td><td data-label=\"판정 내용\">주 단위<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분 기준\">오류 비용<\/td><td data-label=\"판정 내용\">계약 변경과 임상시험 참여자 이관 부담<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분 기준\">판정<\/td><td data-label=\"판정 내용\">전략적 결정<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": []}, {"no": 9, "part": 3, "key": "WHAT", "practice": false, "title": "필수 필터(Go/No-Go Gate) · 임상시험 참여자 안전 · 규제 준수 · 데이터 무결성(ALCOA+)", "plain": "필수 필터(Go/No-Go Gate) · 임상시험 참여자 안전 · 규제 준수 · 데이터 무결성(ALCOA+)", "html": "<p class=\"lead\">임상시험 참여자 안전 · 규제 준수 · 데이터 무결성(ALCOA+)의 세 필수 필터를 통과한 대안만 비교 대상에 둡니다.<\/p><p>대안을 점수로 비교하기 전에 필수 필터부터 적용합니다. 임상시험 참여자 안전, 규제 준수, 데이터 무결성(ALCOA+) 가운데 하나라도 충족하지 못한 대안은 점수 비교 대상에서 제외합니다. 필수 조건을 놓친 대안은 실태조사(GCP Inspection) 지적, 품목 허가 반려, 임상시험 중단 처분으로 이어질 수 있습니다. ICH E8(R1)은 핵심 품질 요인(CtQ)에 자원을 집중하도록 권고합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">필수 필터<\/td><td data-label=\"내용\">임상시험 참여자 안전 · 규제 준수 · 데이터 무결성(ALCOA+)<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">적용 원칙<\/td><td data-label=\"내용\">미충족 대안은 비교 전 제외 · 점수 비교 대상에서 제외<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">미충족 시 결과<\/td><td data-label=\"내용\">실태조사(GCP Inspection) 지적 · 품목 허가 반려 · 임상시험 중단 처분<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">통과 대안의 비교 항목<\/td><td data-label=\"내용\">일정 · 비용 · 자원 · 잔여 리스크<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">유의점<\/div><p>비용이나 일정 사유를 규제 사유로 제시하면 협상 가능 범위가 불명확해집니다. 필수 필터에 해당하는 사유와 일정·비용 사유는 구분해 제시합니다.<\/p><\/div>", "source": "International Council for Harmonisation. (2021). General considerations for clinical studies E8(R1). ICH.", "bridge": "", "fields": []}, {"no": 10, "part": 3, "key": "WHAT", "practice": true, "title": "수용과 거절 사이의 세 번째 대안 · 범위 조정 · 운영 방식 변경 · 자원 증액", "plain": "수용과 거절 사이의 세 번째 대안 · 범위 조정 · 운영 방식 변경 · 자원 증액", "html": "<p class=\"lead\">수용과 거절 두 가지에 더해 범위 조정 · 운영 방식 변경 · 자원 증액의 세 번째 대안을 두고, 대안마다 필요 조건 · 기대 효과 · 감수할 점을 적습니다.<\/p><p>요구를 받았을 때 대안을 수용과 거절 둘로만 두면 판단이 양자택일에 머뭅니다. 범위 조정, 운영 방식 변경, 자원 증액 같은 세 번째 대안을 함께 둡니다. 대안마다 필요 조건, 기대 효과, 감수할 점의 세 항목을 적습니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>기재 항목<\/th><th>예 · 중간 결과 제공<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"기재 항목\">필요 조건<\/td><td data-label=\"예 · 중간 결과 제공\">분석 계획 승인<\/td><\/tr><tr><td class=\"lab\" data-label=\"기재 항목\">기대 효과<\/td><td data-label=\"예 · 중간 결과 제공\">보고 일정 지원<\/td><\/tr><tr><td class=\"lab\" data-label=\"기재 항목\">감수할 점<\/td><td data-label=\"예 · 중간 결과 제공\">전체 일정 단축의 제한<\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">1. 지금 맡은 사안에서 수용과 거절 사이에 둘 수 있는 세 번째 대안 하나를 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d014\" data-cap=\"1. 지금 맡은 사안에서 수용과 거절 사이에 둘 수 있는 세 번째 대안 하나를 적습니다.\" aria-label=\"1. 지금 맡은 사안에서 수용과 거절 사이에 둘 수 있는 세 번째 대안 하나를 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 그 대안을 실행하기 위한 필요 조건을 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d015\" data-cap=\"2. 그 대안을 실행하기 위한 필요 조건을 적습니다.\" aria-label=\"2. 그 대안을 실행하기 위한 필요 조건을 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">3. 그 대안을 고를 때 감수할 점을 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d016\" data-cap=\"3. 그 대안을 고를 때 감수할 점을 적습니다.\" aria-label=\"3. 그 대안을 고를 때 감수할 점을 적습니다.\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "d014", "cap": "1. 지금 맡은 사안에서 수용과 거절 사이에 둘 수 있는 세 번째 대안 하나를 적습니다."}, {"k": "d015", "cap": "2. 그 대안을 실행하기 위한 필요 조건을 적습니다."}, {"k": "d016", "cap": "3. 그 대안을 고를 때 감수할 점을 적습니다."}]}, {"no": 11, "part": 3, "key": "WHAT", "practice": true, "title": "판단을 흐리는 다섯 가지 편향과 예방 장치 · 닻 내림 · 확증 · 매몰 비용 · 가용성 · 집단 사고", "plain": "판단을 흐리는 다섯 가지 편향과 예방 장치 · 닻 내림 · 확증 · 매몰 비용 · 가용성 · 집단 사고", "html": "<p class=\"lead\">닻 내림 · 확증 편향 · 매몰 비용 · 가용성 편향 · 집단 사고의 징후와 각각의 예방 장치입니다.<\/p><p>판단을 흐리는 편향 다섯 가지마다 알아볼 수 있는 징후와 미리 둘 수 있는 예방 장치가 있습니다. 결정 전에 어느 편향의 징후가 보이는지 확인하고 해당 예방 장치를 적용합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>편향<\/th><th>징후<\/th><th>예방 장치<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"편향\">닻 내림(Anchoring)<\/td><td data-label=\"징후\">처음 제시된 수치(예 6주)에 판단이 끌림<\/td><td data-label=\"예방 장치\">데이터에 근거해 기준선을 다시 계산<\/td><\/tr><tr><td class=\"lab\" data-label=\"편향\">확증 편향(Confirmation)<\/td><td data-label=\"징후\">자신의 가설에 부합하는 자료만 수집<\/td><td data-label=\"예방 장치\">반대안을 먼저 검토<\/td><\/tr><tr><td class=\"lab\" data-label=\"편향\">매몰 비용(Sunk cost)<\/td><td data-label=\"징후\">이미 투입한 자원 때문에 잘못된 방향을 계속 유지<\/td><td data-label=\"예방 장치\">「지금 처음 시작한다면?」을 물음<\/td><\/tr><tr><td class=\"lab\" data-label=\"편향\">가용성 편향(Availability)<\/td><td data-label=\"징후\">최근 경험한 사례를 실제보다 크게 반영<\/td><td data-label=\"예방 장치\">사례를 축적하고 발생 빈도를 수치로 확인<\/td><\/tr><tr><td class=\"lab\" data-label=\"편향\">집단 사고(Groupthink)<\/td><td data-label=\"징후\">반대 의견이 충분히 제기되지 않은 상태로 결론<\/td><td data-label=\"예방 장치\">익명 설문이나 별도 의견 수집 통로 마련<\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"cbox\"><input type=\"checkbox\" data-k=\"d017\" data-cap=\"1. 닻 내림 · 처음 제시된 수치에 판단이 끌린 적이 있습니다.\"><span>1. 닻 내림 · 처음 제시된 수치에 판단이 끌린 적이 있습니다.<\/span><\/label><\/div><div class=\"wrow\"><label class=\"cbox\"><input type=\"checkbox\" data-k=\"d018\" data-cap=\"2. 확증 편향 · 내 가설에 맞는 자료만 모은 적이 있습니다.\"><span>2. 확증 편향 · 내 가설에 맞는 자료만 모은 적이 있습니다.<\/span><\/label><\/div><div class=\"wrow\"><label class=\"cbox\"><input type=\"checkbox\" data-k=\"d019\" data-cap=\"3. 매몰 비용 · 이미 들인 자원 때문에 방향을 바꾸지 못한 적이 있습니다.\"><span>3. 매몰 비용 · 이미 들인 자원 때문에 방향을 바꾸지 못한 적이 있습니다.<\/span><\/label><\/div><div class=\"wrow\"><label class=\"cbox\"><input type=\"checkbox\" data-k=\"d020\" data-cap=\"4. 가용성 편향 · 최근 겪은 사례를 실제보다 크게 반영한 적이 있습니다.\"><span>4. 가용성 편향 · 최근 겪은 사례를 실제보다 크게 반영한 적이 있습니다.<\/span><\/label><\/div><div class=\"wrow\"><label class=\"cbox\"><input type=\"checkbox\" data-k=\"d021\" data-cap=\"5. 집단 사고 · 반대 의견이 나오지 않은 채 결론에 이른 적이 있습니다.\"><span>5. 집단 사고 · 반대 의견이 나오지 않은 채 결론에 이른 적이 있습니다.<\/span><\/label><\/div><div class=\"wrow\"><label class=\"wcap\">6. 표시한 편향 가운데 하나를 골라 다음 결정에서 둘 예방 장치를 한 줄로 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d022\" data-cap=\"6. 표시한 편향 가운데 하나를 골라 다음 결정에서 둘 예방 장치를 한 줄로 적습니다.\" aria-label=\"6. 표시한 편향 가운데 하나를 골라 다음 결정에서 둘 예방 장치를 한 줄로 적습니다.\"><\/textarea><\/div>", "source": "Tversky, A., &amp; Kahneman, D. (1974). Judgment under uncertainty: Heuristics and biases. Science, 185(4157), 1124-1131. · Nickerson, R. S. (1998). Confirmation bias: A ubiquitous phenomenon in many guises. Review of General Psychology, 2(2), 175-220. · Arkes, H. R., &amp; Blumer, C. (1985). The psychology of sunk cost. Organizational Behavior and Human Decision Processes, 35(1), 124-140. · Janis, I. L. (1982). Groupthink: Psychological studies of policy decisions and fiascoes (2nd ed.). Houghton Mifflin.", "bridge": "", "fields": [{"k": "d017", "cap": "1. 닻 내림 · 처음 제시된 수치에 판단이 끌린 적이 있습니다."}, {"k": "d018", "cap": "2. 확증 편향 · 내 가설에 맞는 자료만 모은 적이 있습니다."}, {"k": "d019", "cap": "3. 매몰 비용 · 이미 들인 자원 때문에 방향을 바꾸지 못한 적이 있습니다."}, {"k": "d020", "cap": "4. 가용성 편향 · 최근 겪은 사례를 실제보다 크게 반영한 적이 있습니다."}, {"k": "d021", "cap": "5. 집단 사고 · 반대 의견이 나오지 않은 채 결론에 이른 적이 있습니다."}, {"k": "d022", "cap": "6. 표시한 편향 가운데 하나를 골라 다음 결정에서 둘 예방 장치를 한 줄로 적습니다."}]}, {"no": 12, "part": 3, "key": "WHAT", "practice": false, "title": "우선순위 정하기 · 트리아지 네 등급(Red · Yellow · Green · Black)과 노력·효과 2×2", "plain": "우선순위 정하기 · 트리아지 네 등급(Red · Yellow · Green · Black)과 노력·효과 2×2", "html": "<p class=\"lead\">트리아지 네 등급 Red · Yellow · Green · Black과 노력·효과 2×2 매트릭스로 과제의 처리 순서를 정합니다.<\/p><p>트리아지(triage)는 한정된 자원을 최고의 효율로 배분하는 시스템입니다. 긴급성, 중요성, 자원 가용성의 세 축으로 사안을 네 등급으로 나누고 등급마다 대응 방식을 정합니다. 업무 우선순위를 영향도 · 긴급도 · 규제 노출 · 필요한 노력의 같은 기준으로 정하면 팀 안에서 우선순위 변경 사유를 설명할 수 있습니다. 규제 노출과 마감이 함께 임박한 업무는 즉시 처리하고, 긴급도가 낮은 업무는 보류 사유를 기록하며, 어느 경우든 담당자와 기한을 지정합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>등급<\/th><th>해당 사안<\/th><th>대응<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"등급\">Red(Immediate)<\/td><td data-label=\"해당 사안\">프로젝트 중단 위기 · SAE 미보고 · 치명적 프로토콜 위반<\/td><td data-label=\"대응\">스폰서 즉시 상향 보고 · PM 최우선 개입<\/td><\/tr><tr><td class=\"lab\" data-label=\"등급\">Yellow(Delayed)<\/td><td data-label=\"해당 사안\">CRF 입력 지연 · 일부 쿼리 미해결<\/td><td data-label=\"대응\">CRA 위임 후 기한 추적<\/td><\/tr><tr><td class=\"lab\" data-label=\"등급\">Green(Minimal)<\/td><td data-label=\"해당 사안\">일상 행정 · 단순 오타 수정<\/td><td data-label=\"대응\">일괄 처리<\/td><\/tr><tr><td class=\"lab\" data-label=\"등급\">Black(Expectant)<\/td><td data-label=\"해당 사안\">계약 범위 밖의 스폰서 추가 요구<\/td><td data-label=\"대응\">범위 변경 · 계약 부서 협의<\/td><\/tr><\/tbody><\/table><\/div><p>과제의 크기와 성과를 맞출 때는 효과와 노력을 두 축으로 하는 2×2 매트릭스를 씁니다. 자원이 부족할 때는 저효용 과제의 범위를 축소하고 즉효 과제부터 착수합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>과제<\/th><th>처리<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"과제\">즉효 과제(Quick Wins)<\/td><td data-label=\"처리\">즉시 실행<\/td><\/tr><tr><td class=\"lab\" data-label=\"과제\">대형 과제(Major Projects)<\/td><td data-label=\"처리\">전략적 기획 후 실행<\/td><\/tr><tr><td class=\"lab\" data-label=\"과제\">보완 과제(Fill Ins)<\/td><td data-label=\"처리\">여유 시간에 처리<\/td><\/tr><tr><td class=\"lab\" data-label=\"과제\">저효용 과제(Thankless Tasks)<\/td><td data-label=\"처리\">제외 또는 스폰서 협의로 축소<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": []}, {"no": 13, "part": 3, "key": "WHAT", "practice": false, "title": "가중치 의사결정 매트릭스 4단계와 비교 기준", "plain": "가중치 의사결정 매트릭스 4단계와 비교 기준", "html": "<p class=\"lead\">필수 조건 확인 · 기준과 비중 합의 · 근거에 따른 비교 · 조건과 리스크를 포함한 선택의 4단계와, 비교 기준을 고르는 원칙입니다.<\/p><ol class=\"steps\"><li><b>필수 조건 확인<\/b> <span>안전과 규제 같은 필수 조건을 통과한 대안만 비교 대상에 둡니다<\/span><\/li><li><b>기준과 비중 합의<\/b> <span>비교 기준을 4개 안팎으로 고르고 비중 합계가 100%가 되도록 배분하며, 비중을 둔 근거를 적습니다<\/span><\/li><li><b>근거에 따른 비교<\/b> <span>같은 기준으로 대안을 비교하고 점수 근거 자료의 날짜와 출처를 기록합니다<\/span><\/li><li><b>조건과 리스크를 포함한 선택<\/b> <span>점수 차이가 작으면 1위 확정을 보류하고 추가로 확인할 사실을 기록합니다<\/span><\/li><\/ol><p>점수는 선택 근거를 눈에 보이게 하는 장치이고 최종 결론과는 별개입니다. 비중은 팀과 스폰서가 무엇을 중시하는지를 나타냅니다. 예를 들어 일정 영향에 30%를 둔다면 그 근거는 규제 마일스톤 임박처럼 확인할 수 있는 사실로 적습니다. 안전과 규제는 비교 기준에 넣지 않고 별도의 필수 조건으로 둡니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>항목<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">필수 조건(비교 기준과 구분)<\/td><td data-label=\"항목\">안전 · 규제<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">비교 기준<\/td><td data-label=\"항목\">일정 · 비용 · 잔여 리스크 · 스폰서 수용도 · 자원 가용성<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">선정 원칙<\/td><td data-label=\"항목\">비교 기준 4개 안팎 · 판단 명료화<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">기재 예<\/td><td data-label=\"항목\">비교 기준 일정 영향 · 선정 이유 마일스톤 지연 방지 · 확인 자료 계약 일정<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": []}, {"no": 14, "part": 3, "key": "WHAT", "practice": true, "title": "결정 지점 분류표 · 결정 성격(운영·전략) · 문제 유형(발생형·설정형) · 필수 조건 충족 여부", "plain": "결정 지점 분류표 · 결정 성격(운영·전략) · 문제 유형(발생형·설정형) · 필수 조건 충족 여부", "html": "<p class=\"lead\">결정 성격(운영·전략) · 문제 유형(발생형·설정형) · 필수 조건 충족 여부의 세 기준으로 사안을 분류합니다.<\/p><p>결정 사안이 생기면 세 가지를 묻습니다. 되돌릴 수 있는지와 영향이 얼마나 되는지로 결정 성격을, 이미 일어났는지와 앞으로 생길 일인지로 문제 유형을, 규제 · 계약 · 안전을 충족하는지로 필수 조건 충족 여부를 정합니다. 전략적 결정에는 대안 비교와 승인 경로를 함께 기재합니다. 승인 없이 처리하려는 전략적 결정이 있는지도 이 분류표로 확인합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>분류 기준<\/th><th>묻는 것<\/th><th>구분<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"분류 기준\">결정 성격<\/td><td data-label=\"묻는 것\">되돌릴 수 있나 · 영향은 얼마나<\/td><td data-label=\"구분\">운영 · 전략<\/td><\/tr><tr><td class=\"lab\" data-label=\"분류 기준\">문제 유형<\/td><td data-label=\"묻는 것\">이미 일어났나 · 앞으로 생기나<\/td><td data-label=\"구분\">발생형 · 설정형<\/td><\/tr><tr><td class=\"lab\" data-label=\"분류 기준\">필수 조건<\/td><td data-label=\"묻는 것\">규제 충족 · 계약 충족 · 안전 충족<\/td><td data-label=\"구분\">충족 · 충족 여부 확인 필요<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">사례 · 신규 국가 추가<\/div><p>결정 사안을 신규 국가 추가로 두면, 결정 성격은 운영과 전략 가운데, 문제 유형은 발생형과 설정형 가운데, 필수 조건은 충족과 충족 여부 확인 필요 가운데 하나로 적습니다. 국가 추가는 일정 · 비용 · 범위 · 수익성에 장기적 영향을 미치는 전략적 결정의 예에 해당합니다.<\/p><\/div><div class=\"wrow\"><label class=\"wcap\">1. 지금 맡은 결정 사안을 한 줄로 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d023\" data-cap=\"1. 지금 맡은 결정 사안을 한 줄로 적습니다.\" aria-label=\"1. 지금 맡은 결정 사안을 한 줄로 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 결정 성격 · 운영과 전략 가운데 하나를 적고, 되돌릴 수 있는지와 영향 범위를 짧게 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d024\" data-cap=\"2. 결정 성격 · 운영과 전략 가운데 하나를 적고, 되돌릴 수 있는지와 영향 범위를 짧게 적습니다.\" aria-label=\"2. 결정 성격 · 운영과 전략 가운데 하나를 적고, 되돌릴 수 있는지와 영향 범위를 짧게 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">3. 문제 유형 · 발생형과 설정형 가운데 하나를 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d025\" data-cap=\"3. 문제 유형 · 발생형과 설정형 가운데 하나를 적습니다.\" aria-label=\"3. 문제 유형 · 발생형과 설정형 가운데 하나를 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">4. 필수 조건 충족 여부 · 규제 · 계약 · 안전 가운데 확인이 필요한 것을 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d026\" data-cap=\"4. 필수 조건 충족 여부 · 규제 · 계약 · 안전 가운데 확인이 필요한 것을 적습니다.\" aria-label=\"4. 필수 조건 충족 여부 · 규제 · 계약 · 안전 가운데 확인이 필요한 것을 적습니다.\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "d023", "cap": "1. 지금 맡은 결정 사안을 한 줄로 적습니다."}, {"k": "d024", "cap": "2. 결정 성격 · 운영과 전략 가운데 하나를 적고, 되돌릴 수 있는지와 영향 범위를 짧게 적습니다."}, {"k": "d025", "cap": "3. 문제 유형 · 발생형과 설정형 가운데 하나를 적습니다."}, {"k": "d026", "cap": "4. 필수 조건 충족 여부 · 규제 · 계약 · 안전 가운데 확인이 필요한 것을 적습니다."}]}, {"no": 15, "part": 4, "key": "HOW", "practice": false, "title": "리스크 관리 3단계 · 식별 · 정량화 · 대응 설계와 리스크 레지스터 등급", "plain": "리스크 관리 3단계 · 식별 · 정량화 · 대응 설계와 리스크 레지스터 등급", "html": "<p class=\"lead\">리스크를 식별하고 발생 확률 × 영향으로 점수를 낸 뒤 플랜 B와 트리거를 정하는 세 단계, 그리고 리스크 레지스터의 점수별 네 등급과 예외 규정입니다.<\/p><p>리스크는 원치 않는 결과를 초래할 미래의 사건이고, 리스크 관리는 그 원인이 될 만한 것을 관리하는 일입니다. 아직 발생하지 않은 위험(Risk)은 리스크 관리의 대상이고, 이미 발생한 문제(Problem)는 위기관리의 대상입니다. 리스크 관리는 식별, 정량화, 대응 설계의 세 단계로 진행하며 단계마다 산출물이 하나씩 남습니다.<\/p><h3 class=\"sec\">리스크 관리 3단계와 산출물<\/h3><ol class=\"steps\"><li><b>식별<\/b> <span>아직 발생하지 않은 변수를 설정형 문제로 상정해 리스크 목록을 만듭니다<\/span><\/li><li><b>정량화<\/b> <span>발생 확률과 영향을 곱해 리스크 점수를 내고 리스크 레지스터에 적습니다<\/span><\/li><li><b>대응 설계<\/b> <span>리스크마다 플랜 B와 발동 조건(트리거)을 정해 트리거 표에 적습니다<\/span><\/li><\/ol><p>리스크 레지스터에는 ID, 서술, 확률, 영향, 점수, 등급, 플랜 B, 트리거, 결정권자의 아홉 항목을 적습니다. 예를 들어 등록률 하락(R1)은 확률 4와 영향 5의 곱인 20점으로 적색이고, CRA 결원(R3)은 확률 4와 영향 4의 곱인 16점으로 적색입니다. 보류 대안은 효과, 비용, 전환 시점을 함께 기록합니다.<\/p><h3 class=\"sec\">리스크 레지스터 등급별 대응 원칙<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>등급<\/th><th>점수<\/th><th>대응 원칙<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"등급\">적색<\/td><td data-label=\"점수\">15~25<\/td><td data-label=\"대응 원칙\">즉시 대응 설계, 경영진 보고, 트리거 사전 확정<\/td><\/tr><tr><td class=\"lab\" data-label=\"등급\">황색<\/td><td data-label=\"점수\">8~14<\/td><td data-label=\"대응 원칙\">플랜 B 준비, 월간 점검<\/td><\/tr><tr><td class=\"lab\" data-label=\"등급\">녹색<\/td><td data-label=\"점수\">3~7<\/td><td data-label=\"대응 원칙\">수용, 분기별 재평가<\/td><\/tr><tr><td class=\"lab\" data-label=\"등급\">회색<\/td><td data-label=\"점수\">1~2<\/td><td data-label=\"대응 원칙\">레지스터 기록에 한정<\/td><\/tr><tr><td class=\"lab\" data-label=\"등급\">예외<\/td><td data-label=\"점수\">점수와 무관<\/td><td data-label=\"대응 원칙\">안전성 보고 등 규제 기한 관련 리스크는 적색으로 대응<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": []}, {"no": 16, "part": 4, "key": "HOW", "practice": true, "title": "리스크 대응 5유형 · 상향 · 회피 · 전가 · 완화 · 수용과 플랜 B 트리거", "plain": "리스크 대응 5유형 · 상향 · 회피 · 전가 · 완화 · 수용과 플랜 B 트리거", "html": "<p class=\"lead\">리스크마다 다섯 가지 대응 가운데 하나를 고르고, 플랜 B로 바꿀 시점을 관찰 가능한 징후로 미리 정하는 방법입니다.<\/p><p>리스크 대응은 상향, 회피, 전가, 완화, 수용의 다섯 유형으로 나누어 적습니다. PM 권한 밖의 리스크는 스폰서 거버넌스에 상향하고, 위임할 수 없는 안전성 보고는 PM이 직접 수행합니다. 트리거는 플랜 B로 전환할 시점을 알리는 관찰 가능한 징후이며, 프로젝트 초기에 플랜 B와 함께 스폰서와 합의해 두면 발동할 때 재승인 절차를 생략할 수 있습니다. 리스크 하나에 대응 하나를 적습니다.<\/p><h3 class=\"sec\">리스크 대응 5유형<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>유형<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"유형\">상향<\/td><td data-label=\"내용\">상위 결정권자에게 요청<\/td><\/tr><tr><td class=\"lab\" data-label=\"유형\">회피<\/td><td data-label=\"내용\">리스크 발생 경로를 차단하도록 방법 변경<\/td><\/tr><tr><td class=\"lab\" data-label=\"유형\">전가<\/td><td data-label=\"내용\">제3자에게 부담 이전<\/td><\/tr><tr><td class=\"lab\" data-label=\"유형\">완화<\/td><td data-label=\"내용\">발생 가능성 또는 영향 축소<\/td><\/tr><tr><td class=\"lab\" data-label=\"유형\">수용<\/td><td data-label=\"내용\">조건을 확인하고 관리<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">플랜 B·C의 다섯 수립 항목과 트리거 예<\/div><p>수립 항목은 조기 경보 지표, 트리거, 대안 액션, 자원 소요, 결정권자의 다섯 가지입니다. 전환 흐름은 플랜 A에서 트리거 R1 「2주 연속 주간 등록 &lt; 계획의 80%」가 관찰되면 플랜 B로 넘어가고, 플랜 B의 다음 단계는 플랜 C(스폰서 재협상)입니다. 조기 경보 지표의 예는 임상시험 참여자 문의 건수의 전주 대비 30% 감소입니다.<\/p><\/div><div class=\"wrow\"><label class=\"wcap\">1. 담당 프로젝트에서 아직 일어나지 않았지만 우려되는 리스크 하나를 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d027\" data-cap=\"1. 담당 프로젝트에서 아직 일어나지 않았지만 우려되는 리스크 하나를 적습니다.\" aria-label=\"1. 담당 프로젝트에서 아직 일어나지 않았지만 우려되는 리스크 하나를 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 그 리스크에서 플랜 B로 바꿀 시점을 알리는, 관찰할 수 있는 징후 하나를 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d028\" data-cap=\"2. 그 리스크에서 플랜 B로 바꿀 시점을 알리는, 관찰할 수 있는 징후 하나를 적습니다.\" aria-label=\"2. 그 리스크에서 플랜 B로 바꿀 시점을 알리는, 관찰할 수 있는 징후 하나를 적습니다.\"><\/textarea><\/div>", "source": "Project Management Institute. (2021). A guide to the project management body of knowledge (PMBOK guide) (7th ed.). PMI.", "bridge": "", "fields": [{"k": "d027", "cap": "1. 담당 프로젝트에서 아직 일어나지 않았지만 우려되는 리스크 하나를 적습니다."}, {"k": "d028", "cap": "2. 그 리스크에서 플랜 B로 바꿀 시점을 알리는, 관찰할 수 있는 징후 하나를 적습니다."}]}, {"no": 17, "part": 4, "key": "HOW", "practice": false, "title": "결정 문서(1 Page Report) 다섯 항목 · 결정 사항 · 배경·제약 · 대안 비교 · 영향·리스크 · 요청 사항", "plain": "결정 문서(1 Page Report) 다섯 항목 · 결정 사항 · 배경·제약 · 대안 비교 · 영향·리스크 · 요청 사항", "html": "<p class=\"lead\">결정권자가 별도 설명 없이 승인 여부를 판단할 수 있도록 한 쪽에 적는 결정 문서의 다섯 항목과 작성 원칙입니다.<\/p><p>결정 문서(1 Page Report)는 결정권자가 별도 설명 없이 승인 여부를 판단할 수 있도록 구성하는 문서입니다. 항목은 결정 사항, 배경·제약, 대안 비교, 영향·리스크, 요청 사항의 다섯 가지입니다. 다 적은 뒤에는 이 문서만으로 승인 여부를 판단할 수 있는지 확인합니다.<\/p><h3 class=\"sec\">결정 문서 작성 예와 작성 원칙<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">결정 사항 예<\/td><td data-label=\"내용\">RBM 전환 검토<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">배경·제약 예<\/td><td data-label=\"내용\">안전·데이터 신뢰성 유지<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">작성 원칙 1<\/td><td data-label=\"내용\">규제·품질 조건과 비용·일정 조건의 분리 기재<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">작성 원칙 2<\/td><td data-label=\"내용\">요청 대상·내용·기한 명시<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": []}, {"no": 18, "part": 4, "key": "HOW", "practice": false, "title": "반대 의견 대응 5단계 · 인정 · 재진술 · 근거 제시 · 조건부 수용 · 합의 확인과 이해관계자 지도", "plain": "반대 의견 대응 5단계 · 인정 · 재진술 · 근거 제시 · 조건부 수용 · 합의 확인과 이해관계자 지도", "html": "<p class=\"lead\">반대 의견에 다섯 단계로 답하는 순서와, 영향력과 관심도에 따라 이해관계자별 소통 방식을 정하는 지도입니다.<\/p><p>같은 문제와 상황에도 입장과 이해도에 따라 관점과 접근 방식이 달라질 수 있습니다. 그래서 사실은 확인된 것만 말하고, 잘못될 수 있는 위험요소와 좋아질 수 있는 이득을 각각 먼저 확인합니다. 반대 의견에는 인정, 재진술, 근거 제시, 조건부 수용, 합의 확인의 다섯 단계로 답하며, 함께 쓰는 기법으로 LAARC(경청 · 인정 · 본질 확인 · 대응 · 합의 확인)가 있습니다. 반대 근거를 찾는 목적은 결정 조건을 정교하게 만드는 데 있습니다.<\/p><h3 class=\"sec\">반대 의견 대응 5단계<\/h3><ol class=\"steps\"><li><b>인정<\/b> <span>상대의 우려를 인정합니다. 인정을 생략하면 상대의 우려가 무시되었다는 인식이 남습니다<\/span><\/li><li><b>재진술<\/b> <span>확인 질문을 합니다. 예: 「일정과 비용 가운데 가장 우려되는 부분은 무엇입니까?」<\/span><\/li><li><b>근거 제시<\/b> <span>수치를 들어 감정 논쟁을 사실 논의로 전환합니다. 비용 우려에는 총비용, 규제 우려에는 준수 조건, 권한 우려에는 승인 경로를 제시합니다<\/span><\/li><li><b>조건부 수용<\/b> <span>조건을 붙인 합의안을 제시합니다<\/span><\/li><li><b>합의 확인<\/b> <span>합의한 내용을 확인합니다<\/span><\/li><\/ol><p>이해관계자 지도는 영향력과 관심도를 두 축으로 이해관계자의 위치를 정하고, 위치마다 보고 방식을 달리하는 방법입니다. PM은 스폰서 소통의 단일 창구(Single Point of Contact)입니다.<\/p><h3 class=\"sec\">이해관계자 지도 · 영향력 × 관심도 · CRO 예<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>영역<\/th><th>영향력 · 관심도<\/th><th>대상<\/th><th>소통 방식<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"영역\">긴밀 관리<\/td><td data-label=\"영향력 · 관심도\">영향력 높음 · 관심도 높음<\/td><td data-label=\"대상\">스폰서 임상팀장, 스폰서 PM, 핵심 PI<\/td><td data-label=\"소통 방식\">주간 보고, 의사결정 참여 요청<\/td><\/tr><tr><td class=\"lab\" data-label=\"영역\">만족 유지<\/td><td data-label=\"영향력 · 관심도\">영향력 높음 · 관심도 낮음<\/td><td data-label=\"대상\">규제 담당 임원, 재무, 경영진<\/td><td data-label=\"소통 방식\">월간 보고, 마일스톤 시점 별도 브리핑<\/td><\/tr><tr><td class=\"lab\" data-label=\"영역\">정보 제공<\/td><td data-label=\"영향력 · 관심도\">영향력 낮음 · 관심도 높음<\/td><td data-label=\"대상\">CRA, 데이터 매니저, 사이트 코디네이터<\/td><td data-label=\"소통 방식\">주간 브리핑, 우선순위·절차 전달<\/td><\/tr><tr><td class=\"lab\" data-label=\"영역\">모니터링<\/td><td data-label=\"영향력 · 관심도\">영향력 낮음 · 관심도 낮음<\/td><td data-label=\"대상\">외부 협력사, 벤더<\/td><td data-label=\"소통 방식\">-<\/td><\/tr><\/tbody><\/table><\/div>", "source": "de Bono, E. (1985). Six thinking hats. Little, Brown. · Mendelow, A. L. (1981). Environmental scanning: The impact of the stakeholder concept. Proceedings of the 2nd International Conference on Information Systems.", "bridge": "", "fields": []}, {"no": 19, "part": 4, "key": "HOW", "practice": false, "title": "협상의 정의 · 분배형 협상과 통합형 협상", "plain": "협상의 정의 · 분배형 협상과 통합형 협상", "html": "<p class=\"lead\">협상은 공통된 이해관계와 상충되는 이해관계가 함께 있을 때 합의에 이르기 위해 주고받는 커뮤니케이션이고, 정해진 몫을 배분하는 분배형과 새 선택지를 만들어 양측이 얻는 가치를 높이는 통합형으로 나뉩니다.<\/p><p>하버드 협상 연구소(Fisher &amp; Ury, Getting to Yes)는 협상을 「양측이 공통된 이해관계와 상충되는 이해관계를 모두 가지고 있을 때, 합의에 도달하기 위해 나누는 상호작용적 커뮤니케이션(Back-and-Forth Communication)」으로 정의합니다. 협상은 양측이 함께 풀 문제를 정하고 합의하는 커뮤니케이션입니다. 「혼자서는 풀 수 없는 문제를 함께 해결하는 과정」으로 다시 정의할 수 있습니다. 상대를 굴복시키려고 근거를 쌓을수록 상대의 방어도 두터워지므로, 규정이 증명하는 사실을 앞세우기 전에 상대가 실제로 풀고 싶은 문제를 먼저 확인합니다.<\/p><h3 class=\"sec\">협상의 두 가지 접근법<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>분배형 협상(Distributive · Zero-Sum)<\/th><th>통합형 협상(Integrative · Win-Win)<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">관점<\/td><td data-label=\"분배형 협상(Distributive · Zero-Sum)\">정해진 몫을 배분하는 방식(Win-Lose)<\/td><td data-label=\"통합형 협상(Integrative · Win-Win)\">새 선택지로 양측의 가치를 높이는 방식(Win-Win)<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">목표<\/td><td data-label=\"분배형 협상(Distributive · Zero-Sum)\">내 몫을 최대한 많이 가져오기<\/td><td data-label=\"통합형 협상(Integrative · Win-Win)\">양측 이해관계를 모두 충족하는 최적 해법 찾기<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">전략<\/td><td data-label=\"분배형 협상(Distributive · Zero-Sum)\">정보 숨기기 · 입장 고수 · 압박<\/td><td data-label=\"통합형 협상(Integrative · Win-Win)\">정보 공유 · 이해관계 탐색 · 창의적 대안 제시<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">결과<\/td><td data-label=\"분배형 협상(Distributive · Zero-Sum)\">단기적 이익 · 관계 손상 가능성<\/td><td data-label=\"통합형 협상(Integrative · Win-Win)\">장기적 이익 · 관계 강화<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">협상에 대한 세 가지 오해와 진실<\/div><p>오해 1 협상은 이기고 지는 전쟁 → 진실 공동의 문제를 해결하는 파트너십<br>오해 2 타고난 말재주가 결정 → 진실 90퍼센트의 준비와 10퍼센트의 실행<br>오해 3 관계를 위해 양보해야 함 → 진실 최고의 결과와 좋은 관계는 동행<br>통합형 협상은 질문과 경청으로 숨은 이해관계를 파악하고, 새로운 가치를 찾아 새 선택지를 만들어 양측이 얻는 가치를 높이며, 자발적 동의와 장기적 파트너십으로 이어집니다.<\/p><\/div>", "source": "Fisher, R., Ury, W., &amp; Patton, B. (2011). Getting to yes: Negotiating agreement without giving in (3rd ed.). Penguin. · Thompson, L. L. (2020). The mind and heart of the negotiator. Pearson.", "bridge": "", "fields": []}, {"no": 20, "part": 4, "key": "HOW", "practice": true, "title": "입장(Position)과 관심사(Interest) · 「6주 안에 DB lock」 요구의 배경", "plain": "입장(Position)과 관심사(Interest) · 「6주 안에 DB lock」 요구의 배경", "html": "<p class=\"lead\">입장은 상대가 표면에 제시하는 요구이고, 관심사는 그 요구를 내는 이유인 근원적 욕구 · 동기 · 불안입니다.<\/p><p>스폰서가 「6주 안에 DB lock 하세요」라고 요구할 때 규정을 먼저 꺼내 반박하면 입장은 더 굳어집니다. 「6주 단축이 중요한 이유를 여쭤봐도 될까요?」라고 물으면 경쟁사보다 앞선 규제 제출, 11월 경영진 보고 일정 같은 관심사가 드러나고, 질문 하나로 입장 뒤의 관심사(이해관계)를 확인할 수 있습니다. 입장 중심의 협상은 제로섬 구조에 머물고, 관심사 중심의 협상은 양측 제약을 함께 충족하는 해법을 설계합니다.<\/p><h3 class=\"sec\">입장에서 관심사로 · 옵션까지<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>내용<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">입장(Position)<\/td><td data-label=\"내용\">상대가 표면에 제시하는 요구<\/td><td data-label=\"예\">「6주 안에 DB lock 하세요」<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">탐색 질문<\/td><td data-label=\"내용\">요구의 이유를 묻는 질문<\/td><td data-label=\"예\">「6주 단축이 중요한 이유를 여쭤봐도 될까요?」<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">관심사(Interest)<\/td><td data-label=\"내용\">요구 뒤에 있는 이유<\/td><td data-label=\"예\">경쟁사보다 앞선 규제 제출 · 11월 경영진 보고 일정<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">옵션<\/td><td data-label=\"내용\">양측 제약을 함께 충족하는 해법<\/td><td data-label=\"예\">중간분석 시점 6개월 앞당김 · 경영진 보고용 중간 결과 5주 내 제공 · DB lock 2주 단축<\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">1. 최근 협의에서 상대가 말한 입장(표면의 요구)을 한 줄로 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d029\" data-cap=\"1. 최근 협의에서 상대가 말한 입장(표면의 요구)을 한 줄로 적습니다.\" aria-label=\"1. 최근 협의에서 상대가 말한 입장(표면의 요구)을 한 줄로 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 그 요구 뒤에 있을 관심사를 추정해 한 줄로 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d030\" data-cap=\"2. 그 요구 뒤에 있을 관심사를 추정해 한 줄로 적습니다.\" aria-label=\"2. 그 요구 뒤에 있을 관심사를 추정해 한 줄로 적습니다.\"><\/textarea><\/div>", "source": "Fisher, R., Ury, W., &amp; Patton, B. (2011). Getting to yes: Negotiating agreement without giving in (3rd ed.). Penguin.", "bridge": "", "fields": [{"k": "d029", "cap": "1. 최근 협의에서 상대가 말한 입장(표면의 요구)을 한 줄로 적습니다."}, {"k": "d030", "cap": "2. 그 요구 뒤에 있을 관심사를 추정해 한 줄로 적습니다."}]}, {"no": 21, "part": 4, "key": "HOW", "practice": false, "title": "협상력을 정하는 세 변수 · 정보 · 시간 · 힘, 그리고 협상을 망치는 다섯 인지 편향", "plain": "협상력을 정하는 세 변수 · 정보 · 시간 · 힘, 그리고 협상을 망치는 다섯 인지 편향", "html": "<p class=\"lead\">협상력은 정보 · 시간 · 힘 세 변수로 정해지고, 앵커링 · 고정 파이 · 과신 · 확증 · 자기중심적 편향이 협상의 질을 떨어뜨립니다.<\/p><p>세 변수 가운데 가장 빠르게 키울 수 있는 것은 정보이고, 정보는 준비 시간에 비례해 쌓입니다. 정보의 비대칭성은 곧 힘의 불균형입니다. 시간은 누가 더 마감의 압박을 받는가의 문제이고 쫓기는 쪽이 양보하게 됩니다. 힘의 원천은 하나가 아니어서 갑과 을의 지위 외에도 관계 · 대안 · 전문성 · 위임된 권한, 대체 불가능한 실무 역량과 축적된 신뢰에서 생깁니다.<\/p><h3 class=\"sec\">협상력 3대 변수<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>변수<\/th><th>내용<\/th><th>요점<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"변수\">정보(Information)<\/td><td data-label=\"내용\">내가 아는 것 · 상대가 아는 것 · 내가 모른다는 사실조차 모르는 것의 구분<\/td><td data-label=\"요점\">준비 시간에 비례해 쌓임<\/td><\/tr><tr><td class=\"lab\" data-label=\"변수\">시간(Time)<\/td><td data-label=\"내용\">DB lock 예정일 · 규제 제출 기한 · 경영진 보고 일정 같은 마감의 압박<\/td><td data-label=\"요점\">쫓기는 쪽이 양보하게 됨<\/td><\/tr><tr><td class=\"lab\" data-label=\"변수\">힘(Power)<\/td><td data-label=\"내용\">지위 · 관계 · 대안 · 전문성 · 위임된 권한 · 실무 역량과 신뢰<\/td><td data-label=\"요점\">힘의 원천은 하나가 아님<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">협상을 망치는 인지 편향 · 징후와 대응<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>편향<\/th><th>징후<\/th><th>대응<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"편향\">앵커링 편향(Anchoring)<\/td><td data-label=\"징후\">처음 제시된 숫자가 기준점이 되어 전체를 지배 · 상대가 먼저 꺼낸 금액에 반응하는 순간 상대의 조건에서 협상이 진행됨<\/td><td data-label=\"대응\">숫자보다 기준을 먼저<\/td><\/tr><tr><td class=\"lab\" data-label=\"편향\">고정 파이 편향(Fixed-Pie)<\/td><td data-label=\"징후\">상대의 이익이 곧 나의 손실이라는 제로섬 사고 · 창의적 대안이 처음부터 검토 대상에서 빠짐<\/td><td data-label=\"대응\">새 선택지를 만들 방법 탐색<\/td><\/tr><tr><td class=\"lab\" data-label=\"편향\">과신 편향(Overconfidence)<\/td><td data-label=\"징후\">자신의 협상력과 설득력을 과대평가해 준비를 소홀히 함<\/td><td data-label=\"대응\">체계적 준비로 대응<\/td><\/tr><tr><td class=\"lab\" data-label=\"편향\">확증 편향(Confirmation Bias)<\/td><td data-label=\"징후\">자신의 믿음과 일치하는 정보만 수용하고 반대 증거는 무시 · 지침에서 자기 판단을 지지하는 조항만 찾는 상태<\/td><td data-label=\"대응\">반대 근거를 스스로 세 가지 찾기<\/td><\/tr><tr><td class=\"lab\" data-label=\"편향\">자기중심적 편향(Self-Serving Bias)<\/td><td data-label=\"징후\">상대의 입장과 제약 조건을 무시하고 자기 관점에서만 해석 · 나는 정당한 요구, 상대는 억지라는 판단<\/td><td data-label=\"대응\">상대 관점에서 한 문단 써 보기<\/td><\/tr><\/tbody><\/table><\/div><p>편향을 인지하는 것만으로도 협상의 질이 향상됩니다.<\/p>", "source": "Shell, G. R. (2006). Bargaining for advantage: Negotiation strategies for reasonable people (2nd ed.). Penguin.", "bridge": "", "fields": []}, {"no": 22, "part": 4, "key": "HOW", "practice": false, "title": "협상 준비의 세 도구 · BATNA · ZOPA · NPT와 목표점 · 마지노선", "plain": "협상 준비의 세 도구 · BATNA · ZOPA · NPT와 목표점 · 마지노선", "html": "<p class=\"lead\">협상 준비는 BATNA로 최저선을 정하고, ZOPA로 합의 가능 영역을 찾고, NPT로 전략을 한 장에 문서화하는 순서로 진행합니다.<\/p><p>최저선을 모르면 합의 영역을 그릴 수 없고, 영역을 모르면 전략을 세울 수 없으므로 세 도구는 이 순서를 지킵니다. BATNA(Best Alternative To a Negotiated Agreement)는 협상이 결렬되었을 때 선택할 수 있는 최상의 대안입니다. 협상 전에 자신의 BATNA를 파악해 가능하면 강화하고, 상대방의 BATNA도 분석해 전략 수립에 활용하며, 계산하되 노출하지 않는 기준선으로 둡니다. ZOPA(Zone Of Possible Agreement)는 나의 마지노선과 상대의 마지노선이 겹치는 합의 가능 영역입니다. ZOPA가 있어야 타결이 가능하고, 협상은 이 구간 안에서 목표점에 얼마나 가까이 가느냐의 문제입니다. NPT(Negotiation Preparation Table)는 전략을 한 장으로 정리한 준비 리스트이고, 빈칸이 곧 남은 과제입니다.<\/p><h3 class=\"sec\">목표점 · 마지노선 · ZOPA 설정<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>용어<\/th><th>뜻<\/th><th>설정 원칙<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"용어\">목표점(Target Point)<\/td><td data-label=\"뜻\">얻고자 하는 현실적 최상값 · 협상의 출발점<\/td><td data-label=\"설정 원칙\">근거를 갖춘 현실적이면서 야심 찬 값 · 마지노선보다 유리하게<\/td><\/tr><tr><td class=\"lab\" data-label=\"용어\">나의 마지노선(Reservation Point)<\/td><td data-label=\"뜻\">양보할 수 없는 최후의 선 · 넘으면 협상을 깨고 BATNA 실행<\/td><td data-label=\"설정 원칙\">상대에게 노출하지 않음 · BATNA의 가치보다 낮지 않게<\/td><\/tr><tr><td class=\"lab\" data-label=\"용어\">상대 마지노선<\/td><td data-label=\"뜻\">상대가 물러설 수 있는 한계<\/td><td data-label=\"설정 원칙\">추정 가설로 둠<\/td><\/tr><tr><td class=\"lab\" data-label=\"용어\">ZOPA 판정<\/td><td data-label=\"뜻\">두 마지노선이 겹치는지 · 폭은 어느 정도인지<\/td><td data-label=\"설정 원칙\">금액 · 기간 · 인원 중 하나는 숫자로 기입 · 겹치지 않으면 새로 올릴 가치를 찾음<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">스폰서의 일정 단축 요구 · BATNA와 ZOPA의 예<\/div><p>CRO의 BATNA: 현 계약 일정대로 수행, 단축분은 변경 요청(Change Request)으로 처리<br>스폰서의 BATNA: 현 일정 수용 또는 일부 업무를 타 CRO · 내부 팀에 위탁<br>ZOPA: 스폰서 최소 수용 2주 ~ CRO 한계 4주<br>옵션 예: 범위 조정 · 중간분석 활용 · 사이트 8개 추가와 RBM 전환<br>협상 5단계: 준비 → 탐색 → 제안 → 조율 → 확정<\/p><\/div><p>BATNA가 약할 때는 세 가지 전략을 씁니다. 첫째, 우리가 아니면 해결되지 않는 지점을 근거로 제시하고, 결렬 시 상대가 잃는 것을 위협이 아니라 질문으로 인지시켜 상대의 BATNA를 약화합니다. 둘째, 규정 · 표준 · 상위 지침 · 유사 사례 처리 기준 같은 객관적 기준을 적용해 힘겨루기를 기준 논의로 바꿉니다. 셋째, 상대의 말과 표정, 메일의 어조에서 마감 시한 · 내부 경쟁 · 상급자의 관심사 같은 숨은 압박을 읽어 정보의 힘을 키웁니다. BATNA가 없어도 기준과 정보가 있으면 협상은 성립합니다.<\/p>", "source": "Fisher, R., Ury, W., &amp; Patton, B. (2011). Getting to yes: Negotiating agreement without giving in (3rd ed.). Penguin. · Shell, G. R. (2006). Bargaining for advantage: Negotiation strategies for reasonable people (2nd ed.). Penguin.", "bridge": "", "fields": []}, {"no": 23, "part": 4, "key": "HOW", "practice": true, "title": "협상 준비 시트(NPT) 6개 항목과 준비 메모", "plain": "협상 준비 시트(NPT) 6개 항목과 준비 메모", "html": "<p class=\"lead\">NPT(Negotiation Preparation Table)는 상대 · 관심사, 양측 BATNA, 합의 범위, 옵션 3개, 교환 조건, 합의 확인 문장 여섯 항목을 한 장에 적는 협상 준비 시트입니다.<\/p><p>외부에서 예상하지 못한 상황에 처하고 내부에서 같은 논의가 되풀이되는 원인은 준비 부족입니다. NPT는 협상 전략을 한 장의 시트로 정리하며, 사흘 전에 초안을 쓰고 하루 전에 상대 · 관심사 칸을 다시 확인하며 회의 직전 5분에는 첫 문장만 봅니다. NPT의 가치는 완성된 표를 넘어 채우다가 빈칸을 발견하는 순간에 있습니다.<\/p><h3 class=\"sec\">NPT 6개 항목<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>항목<\/th><th>적을 내용<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"항목\">상대 · 관심사<\/td><td data-label=\"적을 내용\">협상 상대와 요구 뒤의 이유<\/td><\/tr><tr><td class=\"lab\" data-label=\"항목\">양측 BATNA<\/td><td data-label=\"적을 내용\">결렬 시 나의 대안과 상대의 대안<\/td><\/tr><tr><td class=\"lab\" data-label=\"항목\">합의 범위<\/td><td data-label=\"적을 내용\">양측 수용 범위가 겹치는 구간<\/td><\/tr><tr><td class=\"lab\" data-label=\"항목\">옵션 3개<\/td><td data-label=\"적을 내용\">양측 제약을 함께 충족하는 해법 셋<\/td><\/tr><tr><td class=\"lab\" data-label=\"항목\">교환 조건<\/td><td data-label=\"적을 내용\">제공 조건과 요청 조건을 같은 문장에 병기<\/td><\/tr><tr><td class=\"lab\" data-label=\"항목\">합의 확인 문장<\/td><td data-label=\"적을 내용\">확정 내용과 지연 시 처리를 한 문장으로<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">작성 원칙과 합의 확인 문장 예<\/div><p>작성 원칙: 제공 조건과 요청 조건을 같은 문장에 병기합니다.<br>합의 확인 문장 예: 「옵션 2로 확정. 조건 이행이 5일 이상 지연될 경우 같은 일수만큼 순연.」<\/p><\/div><div class=\"wrow\"><label class=\"wcap\">1. 앞둔 협의 하나를 떠올려 상대의 관심사 한 가지를 한 줄로 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d031\" data-cap=\"1. 앞둔 협의 하나를 떠올려 상대의 관심사 한 가지를 한 줄로 적습니다.\" aria-label=\"1. 앞둔 협의 하나를 떠올려 상대의 관심사 한 가지를 한 줄로 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 그 관심사를 고려한 제안 한 가지를 한 줄로 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d032\" data-cap=\"2. 그 관심사를 고려한 제안 한 가지를 한 줄로 적습니다.\" aria-label=\"2. 그 관심사를 고려한 제안 한 가지를 한 줄로 적습니다.\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">3. 합의 확인 문장 한 가지를 한 줄로 적습니다.<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d033\" data-cap=\"3. 합의 확인 문장 한 가지를 한 줄로 적습니다.\" aria-label=\"3. 합의 확인 문장 한 가지를 한 줄로 적습니다.\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "d031", "cap": "1. 앞둔 협의 하나를 떠올려 상대의 관심사 한 가지를 한 줄로 적습니다."}, {"k": "d032", "cap": "2. 그 관심사를 고려한 제안 한 가지를 한 줄로 적습니다."}, {"k": "d033", "cap": "3. 합의 확인 문장 한 가지를 한 줄로 적습니다."}]}, {"no": 24, "part": 4, "key": "HOW", "practice": false, "title": "설득의 3요소 Logos·Pathos·Ethos와 지식의 저주", "plain": "설득의 3요소 Logos·Pathos·Ethos와 지식의 저주", "html": "<p class=\"lead\">설득의 세 요소 Logos(논리)·Pathos(공감)·Ethos(신뢰)의 뜻과 수단, 그리고 정확한 근거를 제시해도 상대가 움직이지 않는 까닭인 지식의 저주를 다룹니다.<\/p><p>아리스토텔레스는 설득의 요소를 논리와 이성(Logos), 감성과 공감(Pathos), 신뢰와 윤리(Ethos) 셋으로 정리했습니다. Logos는 데이터·통계·사실·분석·증거로 주장의 뼈대를 세우고, Pathos는 공감·스토리텔링·유머·비유·가치 호소로 상대와 감성적 연결을 만들며, Ethos는 전문성·진정성·일관성·책임감 있는 태도·평판으로 말하는 사람에 대한 신뢰를 쌓습니다. Pathos의 예는 고객의 불안감에 공감하고 유관 부서의 고충을 인정하는 것이고, Ethos의 예는 철저한 준비, 일관된 응대, 불리한 정보도 먼저 밝히는 태도입니다. Ethos가 무너지면 Logos와 Pathos는 의미를 잃고, 셋 가운데 하나만 강해서는 설득이 완성되지 않습니다.<\/p><h3 class=\"sec\">설득의 3요소<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>요소<\/th><th>뜻<\/th><th>수단<\/th><th>역할<\/th><th>PM·PL에게<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"요소\">Logos<\/td><td data-label=\"뜻\">논리·이성<\/td><td data-label=\"수단\">데이터, 통계, 사실, 분석, 증거<\/td><td data-label=\"역할\">주장의 뼈대와 이성적 타당성<\/td><td data-label=\"PM·PL에게\">이미 잘하는 것<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">Pathos<\/td><td data-label=\"뜻\">감성·공감<\/td><td data-label=\"수단\">공감, 스토리텔링, 유머, 비유, 가치 호소<\/td><td data-label=\"역할\">상대와의 감성적 연결<\/td><td data-label=\"PM·PL에게\">가장 자주 생략되는 것<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">Ethos<\/td><td data-label=\"뜻\">신뢰·윤리<\/td><td data-label=\"수단\">전문성, 진정성, 일관성, 책임감 있는 태도, 평판<\/td><td data-label=\"역할\">말하는 사람에 대한 신뢰<\/td><td data-label=\"PM·PL에게\">가장 오래 걸리는 것<\/td><\/tr><\/tbody><\/table><\/div><p>지식의 저주는 무언가를 알게 된 뒤에는 알기 전의 상태를 상상하지 못하는 인지 편향이고, 전문가일수록 심하게 나타납니다. 자기 데이터를 100% 이해하는 쪽은 상대도 같은 수준으로 이해한다고 여기지만, 상대는 그 데이터가 만들어진 맥락을 모르고 데이터의 빈틈과 불확실성을 먼저 봅니다. 그래서 정확한 근거를 제시해도 설명이 길어질수록 상대의 방어도 함께 두터워집니다.<\/p><div class=\"box\"><div class=\"bt\">Logos의 저주를 푸는 말 바꾸기<\/div><p>상대가 원하는 것은 완벽한 답보다 안도감입니다. 같은 사실도 상대의 관점에서 문제를 다시 정의하고, 내 근거가 상대의 고충을 어떻게 푸는지를 보여 줄 때 상대가 움직입니다.<br>우리가 하는 말 · 「처리 기간이 사흘 단축되었습니다」<br>상대의 언어로 바꾼 말 · 「우려하신 반복 문의를 줄이기 위해 시작했습니다」<\/p><\/div>", "source": "Aristotle. (1954). Rhetoric. · Heath, C., &amp; Heath, D. (2007). Made to stick. Random House.", "bridge": "", "fields": []}, {"no": 25, "part": 4, "key": "HOW", "practice": false, "title": "SPIN 질문 네 단계 · 상황 · 문제 · 시사 · 해결", "plain": "SPIN 질문 네 단계 · 상황 · 문제 · 시사 · 해결", "html": "<p class=\"lead\">SPIN은 상황(Situation)·문제(Problem)·시사(Implication)·해결(Need-Payoff) 네 단계의 질문으로 상대가 스스로 필요를 말하게 하는 질문 순서입니다.<\/p><p>협상 상대의 필요(Needs)를 분석할 때 SPIN 질문을 씁니다. 상황 질문으로 사실을 수집하고, 문제 질문으로 고충과 불만을 찾아 변화의 동기를 만들고, 시사 질문으로 문제의 파급 효과와 시급성을 인식하게 하며, 해결 질문으로 해결책의 가치를 상대가 직접 말하게 합니다. 상대의 입에서 필요하다는 말이 나오면 설득을 넘어 자발적 동의가 시작됩니다.<\/p><h3 class=\"sec\">SPIN 질문 네 단계<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>단계<\/th><th>질문의 성격<\/th><th>목적<\/th><th>질문 예<\/th><th>질문의 요점<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"단계\">S · Situation 상황 질문<\/td><td data-label=\"질문의 성격\">사실 확인<\/td><td data-label=\"목적\">현재 상황 파악 · 의사결정 구조 이해 · 기존 프로세스 파악<\/td><td data-label=\"질문 예\">「어떻게 진행되어 왔습니까」<\/td><td data-label=\"질문의 요점\">열린 질문으로 시작<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">P · Problem 문제 질문<\/td><td data-label=\"질문의 성격\">고충 파악<\/td><td data-label=\"목적\">문제점 파악 · 불만 사항 도출 · 개선 필요성 인식<\/td><td data-label=\"질문 예\">「이 상황에서 가장 곤란한 부분은 무엇입니까」<\/td><td data-label=\"질문의 요점\">불안이 표면화되는 지점<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">I · Implication 시사 질문<\/td><td data-label=\"질문의 성격\">심각성 확대<\/td><td data-label=\"목적\">문제의 파급 효과 인식 · 비용과 손실 계산 · 해결의 시급성 부각<\/td><td data-label=\"질문 예\">「이어지면 어떤 영향이 있을까요」<\/td><td data-label=\"질문의 요점\">자극하되 협박 금지<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">N · Need-Payoff 해결 질문<\/td><td data-label=\"질문의 성격\">가치 확인<\/td><td data-label=\"목적\">해결책의 이익 인식 · 투자 대비 효과 계산 · 동기 강화<\/td><td data-label=\"질문 예\">「함께 검토할 수 있다면 어떠시겠습니까」<\/td><td data-label=\"질문의 요점\">답하는 순간이 전환점<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">Need-Payoff 해결 질문의 특징<\/div><p>문제의 심각성을 충분히 인식한 상대에게 그 문제가 해결되면 얼마나 좋을지, 해결책의 가치(Payoff)를 스스로 이야기하게 합니다. 해결책을 강요하는 대신 상대가 「그것이 바로 내가 원하는 것」이라고 말하게 하고, 부정적인 문제(I)에 머물던 대화를 긍정적인 해결책(N)으로 전환합니다.<\/p><\/div>", "source": "Rackham, N. (1988). SPIN selling. McGraw-Hill.", "bridge": "", "fields": []}, {"no": 26, "part": 4, "key": "HOW", "practice": false, "title": "프로젝트 협의·협상 질문 뱅크와 단계별 유의점", "plain": "프로젝트 협의·협상 질문 뱅크와 단계별 유의점", "html": "<p class=\"lead\">프로젝트 협의·협상에서 쓰는 SPIN 질문 여덟 개와, 단계마다 하는 것과 하지 않는 것을 정리합니다.<\/p><p>질문은 준비물입니다. 회의 전에 단계별 질문을 적어 두고, 사전 조사로 알 수 없는 것만 묻습니다. 질문 뱅크는 복사해 메모장이나 회의 준비 자료에 옮겨 쓰고, 사안에 맞게 낱말을 바꿔 씁니다.<\/p><div class=\"cpy\"><div class=\"cpy-h\"><span>프로젝트 협의·협상 질문 뱅크<\/span><button class=\"btn cpy-b\" type=\"button\">복사<\/button><\/div><pre class=\"pbox\">S 상황 · 지금까지 어떻게 진행되어 왔습니까\nS 상황 · 유사 상황은 어떻게 처리하셨습니까\nP 문제 · 업무 일정에 어떤 영향을 주고 있습니까\nP 문제 · 내부적으로 어떤 압박을 받고 계십니까\nI 시사 · 비슷한 요청이 반복되면 다른 기관의 일정에는 어떤 영향이 있습니까\nI 시사 · 늦어지면 어느 일정부터 영향을 받습니까\nN 해결 · 해결되면 어떤 점이 좋아지겠습니까\nN 해결 · 함께 기준을 정리하면 어떤 도움이 될까요<\/pre><\/div><h3 class=\"sec\">단계별 유의점<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>단계<\/th><th>이것은 합니다<\/th><th>이것은 하지 않습니다<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"단계\">S 상황<\/td><td data-label=\"이것은 합니다\">사전 조사로 알 수 없는 것만 묻고 경청하며 메모<\/td><td data-label=\"이것은 하지 않습니다\">이미 아는 내용을 반복해 물어 심문처럼 만들기<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">P 문제<\/td><td data-label=\"이것은 합니다\">어려움을 들었을 때 그러셨겠다는 수용을 먼저<\/td><td data-label=\"이것은 하지 않습니다\">그 정도로 뭘 그러냐는 식의 축소와 반박<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">I 시사<\/td><td data-label=\"이것은 합니다\">개인 차원에서 조직 차원으로 영향의 범위를 확장<\/td><td data-label=\"이것은 하지 않습니다\">이렇게 되면 곤란해진다는 단정과 압박<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">N 해결<\/td><td data-label=\"이것은 합니다\">상대가 이익을 스스로 말하도록 질문으로 열어 두기<\/td><td data-label=\"이것은 하지 않습니다\">우리 안이 최선이라는 결론을 먼저 제시<\/td><\/tr><\/tbody><\/table><\/div><p>어느 단계에서든 설명으로 돌아가면 질문의 효과가 줄어듭니다.<\/p>", "source": "Rackham, N. (1988). SPIN selling. McGraw-Hill.", "bridge": "", "fields": []}, {"no": 27, "part": 4, "key": "HOW", "practice": true, "title": "내 사안의 SPIN 질문 만들기", "plain": "내 사안의 SPIN 질문 만들기", "html": "<p class=\"lead\">지금 협의가 필요한 사안 하나를 두고 스폰서·PI·유관 부서 가운데 한 곳에 던질 SPIN 질문을 단계마다 하나씩 적습니다.<\/p><p>상대를 스폰서·PI·유관 부서 가운데 한 곳으로 정하고 사안을 떠올립니다. 상황 질문은 사전 조사로 알 수 없는 사실을, 문제 질문은 상대의 고충을, 시사 질문은 그 문제가 이어질 때의 영향을, 해결 질문은 해결되었을 때 상대가 얻는 것을 묻는 문장으로 적습니다.<\/p><div class=\"box\"><div class=\"bt\">질문 예<\/div><p>S 상황 · 「지금까지 어떻게 진행되어 왔습니까」<br>P 문제 · 「이 상황에서 가장 곤란한 부분은 무엇입니까」<br>I 시사 · 「늦어지면 어느 일정부터 영향을 받습니까」<br>N 해결 · 「함께 검토할 수 있다면 어떠시겠습니까」<\/p><\/div><div class=\"wrow\"><label class=\"wcap\">1. 상황 질문(S) · 상대에게 사실을 확인하는 질문 하나<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d034\" data-cap=\"1. 상황 질문(S) · 상대에게 사실을 확인하는 질문 하나\" aria-label=\"1. 상황 질문(S) · 상대에게 사실을 확인하는 질문 하나\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 문제 질문(P) · 상대가 곤란해하는 부분을 묻는 질문 하나<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d035\" data-cap=\"2. 문제 질문(P) · 상대가 곤란해하는 부분을 묻는 질문 하나\" aria-label=\"2. 문제 질문(P) · 상대가 곤란해하는 부분을 묻는 질문 하나\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">3. 시사 질문(I) · 문제가 이어질 때 어느 일정·업무에 영향이 가는지 묻는 질문 하나<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d036\" data-cap=\"3. 시사 질문(I) · 문제가 이어질 때 어느 일정·업무에 영향이 가는지 묻는 질문 하나\" aria-label=\"3. 시사 질문(I) · 문제가 이어질 때 어느 일정·업무에 영향이 가는지 묻는 질문 하나\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">4. 해결 질문(N) · 해결되면 상대에게 무엇이 좋아지는지 묻는 질문 하나<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d037\" data-cap=\"4. 해결 질문(N) · 해결되면 상대에게 무엇이 좋아지는지 묻는 질문 하나\" aria-label=\"4. 해결 질문(N) · 해결되면 상대에게 무엇이 좋아지는지 묻는 질문 하나\"><\/textarea><\/div>", "source": "Rackham, N. (1988). SPIN selling. McGraw-Hill.", "bridge": "", "fields": [{"k": "d034", "cap": "1. 상황 질문(S) · 상대에게 사실을 확인하는 질문 하나"}, {"k": "d035", "cap": "2. 문제 질문(P) · 상대가 곤란해하는 부분을 묻는 질문 하나"}, {"k": "d036", "cap": "3. 시사 질문(I) · 문제가 이어질 때 어느 일정·업무에 영향이 가는지 묻는 질문 하나"}, {"k": "d037", "cap": "4. 해결 질문(N) · 해결되면 상대에게 무엇이 좋아지는지 묻는 질문 하나"}]}, {"no": 28, "part": 5, "key": "GROW", "practice": false, "title": "PM과 PL의 판단 책임 · 전략적 결정과 기능 실행", "plain": "PM과 PL의 판단 책임 · 전략적 결정과 기능 실행", "html": "<p class=\"lead\">PM과 PL이 맡는 결정, 산출 문서, 보고 흐름을 공통 원칙과 함께 정리합니다.<\/p><p>공통 원칙은 임상시험 참여자 안전, 규제 준수, 데이터 무결성을 우선하는 것입니다. 승인과 자원 결정은 결정권자가 합니다. PM은 스폰서 단일 창구로서 전략적 결정을 맡고, PL은 특정 기능의 실행을 맡으며 조기 징후를 포착해 PM에게 상향 보고합니다.<\/p><h3 class=\"sec\">PM과 PL의 판단 책임<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>PM<\/th><th>PL<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">맡는 결정<\/td><td data-label=\"PM\">스폰서 단일 창구 · 예산·범위·계약 변경·리스크 대응 · 플랜 B·C 수립과 승인<\/td><td data-label=\"PL\">모니터링·데이터·규제 제출 등 특정 기능의 실행 · 태스크 우선순위와 일일 업무 배분 · 조기 징후 포착과 PM 상향 보고<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">산출 문서<\/td><td data-label=\"PM\">프로젝트 관리 계획 · 결정 문서 · 스폰서 보고<\/td><td data-label=\"PL\">기능별 SOP · 작업 지시서 · 현황 보고서<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">예<\/td><td data-label=\"PM\">2주 단축 요구를 영향평가 뒤 1주 단축과 모니터링 2회 추가로 조정<\/td><td data-label=\"PL\">5개 사이트 가운데 3개 우선 방문 결정<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">보고 흐름<\/h3><ol class=\"steps\"><li><b>PL 조기 징후 포착<\/b> <span>PL이 기능을 실행하며 조기 징후를 포착합니다<\/span><\/li><li><b>PM 상향 보고<\/b> <span>PL이 징후를 PM에게 보고합니다<\/span><\/li><li><b>플랜 B·C 수립<\/b> <span>PM이 대응안을 세웁니다<\/span><\/li><li><b>승인<\/b> <span>결정권자가 승인과 자원을 결정합니다<\/span><\/li><\/ol><p>조기 징후 포착부터 플랜 B 승인까지 어느 지점에서 지연이 생기는지를 확인합니다.<\/p>", "source": "", "bridge": "", "fields": []}, {"no": 29, "part": 5, "key": "GROW", "practice": true, "title": "다음 주 적용 계획 · 관심사 조율과 결정 시 확인 사항", "plain": "다음 주 적용 계획 · 관심사 조율과 결정 시 확인 사항", "html": "<p class=\"lead\">다음 주에 결정이 필요한 사안 하나를 골라 사용할 도구, 합의 조건, 다음 확인일을 적습니다.<\/p><p>PI의 관심사는 안전·프로토콜·기관 부담이고 스폰서의 관심사는 일정·비용·보고입니다. PM은 두 관심사를 함께 충족하는 실행안을 도출합니다. 결정 지점 분류표의 결정 성격·문제 유형·필수 필터를 확인한 뒤, 결정 시 확인 사항 네 가지인 사안·사용할 도구·합의 조건·다음 확인일을 적습니다. 사용할 도구는 결정 지점 분류표, Go/No-Go 필수 필터, 가중치 의사결정 매트릭스, BATNA·ZOPA, NPT, SPIN 질문 가운데에서 고릅니다.<\/p><h3 class=\"sec\">관심사 조율<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>관심사·역할<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">PI<\/td><td data-label=\"관심사·역할\">안전 · 프로토콜 · 기관 부담<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">스폰서<\/td><td data-label=\"관심사·역할\">일정 · 비용 · 보고<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">PM<\/td><td data-label=\"관심사·역할\">두 관심사를 함께 충족하는 실행안 도출<\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">1. 사안 · 다음 주 결정이 필요한 사안 하나<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d038\" data-cap=\"1. 사안 · 다음 주 결정이 필요한 사안 하나\" aria-label=\"1. 사안 · 다음 주 결정이 필요한 사안 하나\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">2. 사용할 도구 · 이 사안에 쓸 도구 하나나 둘<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d039\" data-cap=\"2. 사용할 도구 · 이 사안에 쓸 도구 하나나 둘\" aria-label=\"2. 사용할 도구 · 이 사안에 쓸 도구 하나나 둘\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">3. 합의 조건 · 상대와 어떤 조건이 맞으면 합의할지 한 줄<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d040\" data-cap=\"3. 합의 조건 · 상대와 어떤 조건이 맞으면 합의할지 한 줄\" aria-label=\"3. 합의 조건 · 상대와 어떤 조건이 맞으면 합의할지 한 줄\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">4. 다음 확인일 · 결과를 다시 확인할 날짜<\/label><textarea class=\"w\" rows=\"2\" data-k=\"d041\" data-cap=\"4. 다음 확인일 · 결과를 다시 확인할 날짜\" aria-label=\"4. 다음 확인일 · 결과를 다시 확인할 날짜\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "d038", "cap": "1. 사안 · 다음 주 결정이 필요한 사안 하나"}, {"k": "d039", "cap": "2. 사용할 도구 · 이 사안에 쓸 도구 하나나 둘"}, {"k": "d040", "cap": "3. 합의 조건 · 상대와 어떤 조건이 맞으면 합의할지 한 줄"}, {"k": "d041", "cap": "4. 다음 확인일 · 결과를 다시 확인할 날짜"}]}, {"no": 30, "part": 5, "key": "GROW", "practice": false, "title": "오늘 확인한 것 · WHO·WHY·WHAT·HOW·GROW의 도구 한 표", "plain": "오늘 확인한 것 · WHO·WHY·WHAT·HOW·GROW의 도구 한 표", "html": "<p class=\"lead\">과정 전체를 5W 질문 다섯 단계와 단계마다 쓴 도구로 한 표에 정리합니다.<\/p><p>학습목표는 셋입니다. 필수 조건과 비교 기준을 적용해 대안의 장단점을 설명하고 고르는 것, 자료와 BATNA로 일정과 범위 요구를 조율해 스폰서와 합의 조건을 확인하는 것, 결정 지점 분류표와 1 Page Report에 근거와 후속 행동을 남기는 것입니다.<\/p><h3 class=\"sec\">5W 질문과 단계별 도구<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>단계<\/th><th>질문<\/th><th>도구<\/th><th>한 줄<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"단계\">WHO · 관점<\/td><td data-label=\"질문\">누가 겪고 있는가<\/td><td data-label=\"도구\">CRO 프로젝트의 네 가지 제약 · PM의 5 역할<\/td><td data-label=\"한 줄\">제한된 자원·불확실성·이해관계자 충돌·규제 리스크 아래에서 결정하는 PM·PL의 역할 확인<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">WHY · 의미<\/td><td data-label=\"질문\">무엇이 진짜 문제인가<\/td><td data-label=\"도구\">AS-IS · GAP · TO-BE · 문제 문장(현상·영향·기한) · 원인 검증 · 발생형·설정형 구분<\/td><td data-label=\"한 줄\">현재와 목표의 차이를 문장으로 고정하고 원인을 사실로 검증<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">WHAT · 목표<\/td><td data-label=\"질문\">어디로 가야 하는가<\/td><td data-label=\"도구\">Go/No-Go 필수 필터 · 세 번째 대안 · 가중치 의사결정 매트릭스 · 트리아지 · 결정 지점 분류표<\/td><td data-label=\"한 줄\">필수 조건을 통과한 대안을 같은 기준으로 비교하고 결정 성격을 분류<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">HOW · 방법<\/td><td data-label=\"질문\">어떻게 할 것인가<\/td><td data-label=\"도구\">리스크 레지스터 · 1 Page Report · 반대 의견 대응 5단계 · BATNA · ZOPA · NPT · 설득의 3요소 · SPIN 질문<\/td><td data-label=\"한 줄\">리스크와 결정 근거를 문서로 남기고, 결렬 시 대안과 합의 가능 영역을 준비해 질문으로 상대의 관심사를 확인<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">GROW · 지속<\/td><td data-label=\"질문\">무엇을 이어갈 것인가<\/td><td data-label=\"도구\">PM·PL 판단 책임 · 결정 시 확인 사항(사안·도구·합의 조건·다음 확인일)<\/td><td data-label=\"한 줄\">조기 징후를 PM에게 상향하고 다음 주 적용 사안을 정함<\/td><\/tr><\/tbody><\/table><\/div><p>성과를 조직 자산으로 전환하는 과정은 KPI로 성과를 추적하는 실행 및 모니터링, 변화에 능동적으로 대응하는 변경 및 리스크 관리, Lessons Learned로 경험을 축적하는 프로젝트 종료 및 자산화로 이어집니다.<\/p>", "source": "", "bridge": "", "fields": []}]}</script>
