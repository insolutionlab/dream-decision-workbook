    { key: "WHO", name: "관점 · 누가 겪고 있는가", sub: "학습목표, CRO 의사결정의 네 제약, PM·PL의 역할" },
    { key: "WHY", name: "의미 · 무엇이 진짜 문제인가", sub: "문제 정의, 문제 문장, 사실과 필수 조건, 결정의 성격" },
    { key: "WHAT", name: "목표 · 어디로 가야 하는가", sub: "필수 필터, 세 번째 대안, 편향, 우선순위, 결정 지점 분류표" },
    { key: "HOW", name: "방법 · 어떻게 할 것인가", sub: "리스크, 결정 문서, 반대 의견, 협상, SPIN 질문" },
    { key: "GROW", name: "지속 · 무엇을 이어갈 것인가", sub: "PM·PL의 판단 책임, 다음 주 적용 계획" }
  ];
  var KEY = "dreamcis-decision-workbook-v1";
  var TOTAL = 30;

  /* ── 저장소 ── */
  var S = { a: {}, v: {}, pos: -1 };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); S.a = o.a || {}; S.v = o.v || {}; S.pos = typeof o.pos === "number" ? o.pos : -1; }
  } catch (e) {}
  var saveTimer = null;
  function persist(flash) {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    if (flash) {
      var el = document.getElementById("saved");
      el.classList.add("show");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { el.classList.remove("show"); }, 1400);
    }
  }

  /* ── 진행 판정 ── */
  function unitDone(u) {
    if (!u.practice) return !!S.v[u.no];
    for (var i = 0; i < u.fields.length; i++) {
      var v = S.a[u.fields[i].k];
      if (v === true || (typeof v === "string" && v.trim())) return true;
    }
    return false;
  }
  function partStat(p) {
    var t = 0, d = 0;
    U.forEach(function (u) { if (u.part === p) { t++; if (unitDone(u)) d++; } });
    return { t: t, d: d };
  }

  /* ── 여정 레일 ── */
  var rail = document.getElementById("rail");
  PARTS.forEach(function (P, i) {
    var b = document.createElement("button");
    b.className = "stage"; b.dataset.p = i + 1;
    b.innerHTML = '<span class="k">' + P.key + '</span><span class="track"><span class="fill"></span></span>';
    b.setAttribute("aria-label", P.key + " " + P.name + "로 이동");
    b.addEventListener("click", function () { go(firstOf(i + 1)); });
    rail.appendChild(b);
  });
  function firstOf(p) { for (var i = 0; i < U.length; i++) if (U[i].part === p) return i; return 0; }
  function paintRail(curPart) {
    Array.prototype.forEach.call(rail.children, function (b, i) {
      var st = partStat(i + 1);
      b.querySelector(".fill").style.width = (st.t ? (st.d / st.t * 100) : 0) + "%";
      b.classList.toggle("on", curPart === i + 1);
      b.title = PARTS[i].key + " " + st.d + " / " + st.t;
    });
  }

  /* ── 화면 ── */
  var view = document.getElementById("view");
  var cur = -1; // -1 시작 화면, -2 기록 모아보기, 0.. 단원

  function renderStart() {
    var resume = S.pos >= 0 && S.pos < U.length;
    var h = '<section class="hero">';
    h += '<h1>전략적 의사결정</h1><p class="sub">드림씨아이에스 PM·PL 과정 학습 워크북</p>';
    h += '<p class="intro">제약 조건 아래에서 근거로 결정하고 합의하는 방법을 다섯 단계로 정리했습니다. ' +
         '읽는 단원에서 판단 기준을 확인하고, 실습 단원에서 맡은 업무의 사안 하나를 한두 줄로 적습니다. ' +
         '적은 내용은 이 기기에 자동으로 저장됩니다.</p>';
    h += '<ol class="path">';
    PARTS.forEach(function (P, i) {
      var st = partStat(i + 1);
      h += '<li><button data-go="' + firstOf(i + 1) + '"><span class="sk">' + P.key + '</span>' +
           '<span class="sn">' + P.name + '<br><span style="color:var(--mute);font-size:13.5px">' + P.sub + '</span></span>' +
           '<span class="sc"><b>' + st.d + '</b> / ' + st.t + '</span></button></li>';
    });
    h += '</ol><div class="cta">';
    if (resume) h += '<button class="btn primary" data-go="' + S.pos + '">이어서 보기 · ' + U[S.pos].no + '쪽</button>' +
                     '<button class="btn" data-go="0">처음부터 보기</button>';
    else h += '<button class="btn primary" data-go="0">처음부터 시작</button>';
    h += '</div>';
    h += '<div class="how"><h3 class="sec">이 워크북을 쓰는 방법</h3><ol>' +
         '<li>아래 이전 · 다음 단추나 왼쪽 위 목차로 단원을 이동합니다.</li>' +
         '<li>실습 칸에는 지금 맡은 업무의 사안 하나를 떠올려 한두 줄로 적습니다. 정답을 적는 자리가 아니라 초안을 남기는 자리입니다.</li>' +
         '<li>적은 내용은 오른쪽 위 나의 기록에서 한꺼번에 볼 수 있습니다.</li>' +
         '<li>질문 모음 상자의 복사 단추를 누르면 질문이 줄바꿈 그대로 복사됩니다.</li>' +
         '</ol></div>';
    h += '<p class="credit"><b>이소민</b> People Performance Architect, INSOLUTION LAB. 연구소장<br>' +
         '대상 드림씨아이에스 PM·PL<br>' +
         '기록은 이 브라우저에만 저장되며 다른 사람에게 보이지 않습니다.</p>';
    h += '</section>';
    view.innerHTML = h;
    bindGo(view);
  }

  function renderUnit(i) {
    var u = U[i];
    if (!u.practice && !S.v[u.no]) { S.v[u.no] = 1; }
    S.pos = i; persist(false);
    var P = PARTS[u.part - 1];
    var h = '<div class="band"><span class="lb">PART ' + u.part + ' · ' + P.key + '</span>' +
            (u.practice ? '<span class="tag">실습</span>' : '') + '</div>';
    h += '<h2 class="utitle">' + u.title + '</h2>';
    h += '<div class="ubody">' + u.html + '</div>';
    if (u.bridge) h += '<p class="next-hint">' + u.bridge.replace(/다음 쪽/g, "다음 단원") + '</p>';
    if (u.source) h += '<div class="src">출처 ' + u.source + '</div>';
    view.innerHTML = h;
    hydrate(view);
  }

  function renderAnswers() {
    var pr = U.filter(function (u) { return u.practice; });
    var filled = 0, total = 0;
    pr.forEach(function (u) { u.fields.forEach(function (f) { total++; var v = S.a[f.k]; if (v === true || (typeof v === "string" && v.trim())) filled++; }); });
    var h = '<div class="band"><span class="lb">나의 기록</span></div>';
    h += '<h2 class="utitle">실습 기록 모아보기</h2>';
    h += '<p class="meter">실습 칸 <b>' + total + '</b>개 가운데 <b>' + filled + '</b>개를 채웠습니다.</p>';
    h += '<div class="tools"><button class="btn primary" id="btnDl" hidden>기록 내려받기 (.md)</button>' +
         '<button class="btn" id="btnReset">기록 모두 지우기</button></div><p class="note" id="note"></p>';
    pr.forEach(function (u) {
      var i = U.indexOf(u);
      h += '<section class="ans-unit"><h3><button data-go="' + i + '">' + u.no + '쪽 · ' + u.title + '</button></h3>';
      u.fields.forEach(function (f) {
        var v = S.a[f.k], txt, empty = false;
        if (v === true) txt = "확인함";
        else if (typeof v === "string" && v.trim()) txt = v;
        else { txt = "비어 있음"; empty = true; }
        h += '<div class="ans-f"><div class="c">' + esc(f.cap) + '</div><div class="v' + (empty ? ' empty' : '') + '">' + esc(txt) + '</div></div>';
      });
      h += '</section>';
    });
    view.innerHTML = h;
    bindGo(view);
    setupDownload();
    var rb = document.getElementById("btnReset"), armed = false, t = null;
    rb.addEventListener("click", function () {
      if (!armed) { armed = true; rb.textContent = "한 번 더 누르면 모두 지웁니다"; t = setTimeout(function () { armed = false; rb.textContent = "기록 모두 지우기"; }, 4000); return; }
      clearTimeout(t); S.a = {}; S.v = {}; persist(false); paintRail(0); renderAnswers();
      document.getElementById("note").textContent = "모든 기록을 지웠습니다.";
    });
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ── 입력 필드 연결 ── */
  function grow(t) { t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
  function hydrate(root) {
    root.querySelectorAll("textarea[data-k]").forEach(function (t) {
      var v = S.a[t.dataset.k]; if (typeof v === "string") t.value = v;
      requestAnimationFrame(function () { grow(t); });
      t.addEventListener("input", function () {
        grow(t); S.a[t.dataset.k] = t.value; persist(true); paintRail(U[cur] ? U[cur].part : 0); paintToc();
      });
    });
    root.querySelectorAll('input[type="checkbox"][data-k]').forEach(function (c) {
      c.checked = S.a[c.dataset.k] === true;
      c.addEventListener("change", function () {
        if (c.checked) S.a[c.dataset.k] = true; else delete S.a[c.dataset.k];
        persist(true); paintRail(U[cur] ? U[cur].part : 0); paintToc();
      });
    });
  }
  function bindGo(root) {
    root.querySelectorAll("[data-go]").forEach(function (b) {
      b.addEventListener("click", function () { go(parseInt(b.dataset.go, 10)); });
    });
  }

  /* ── 내려받기 ── */
  var dlNS = null, dlChecked = false;
  function buildMd() {
    var d = new Date();
    var md = "# 전략적 의사결정 워크북 기록\n\n작성일 " + d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일\n";
    U.filter(function (u) { return u.practice; }).forEach(function (u) {
      md += "\n## " + u.plain + " (" + u.no + "쪽)\n";
      u.fields.forEach(function (f) {
        var v = S.a[f.k];
        var txt = v === true ? "확인함" : (typeof v === "string" && v.trim() ? v.trim() : "비어 있음");
        md += "\n### " + f.cap + "\n\n" + txt + "\n";
      });
    });
    return md;
  }
  function setupDownload() {
    var btn = document.getElementById("btnDl"); if (!btn) return;
    var show = function () {
      if (!dlNS) return;
      btn.hidden = false;
      btn.onclick = function () {
        var note = document.getElementById("note");
        dlNS.save({ filename: "전략적의사결정_워크북_기록.md", data: buildMd() }).then(function (r) {
          if (r && r.status === "saved") note.textContent = "기록 파일을 내려받았습니다.";
        }).catch(function (e) {
          var c = e && e.code;
          if (c === "declined") note.textContent = "내려받기를 취소했습니다.";
          else if (c === "rate_limited") note.textContent = "이미 열린 확인 창이 있습니다. 잠시 후 다시 눌러 주세요.";
          else { note.textContent = "이 화면에서는 내려받기를 쓸 수 없습니다. 위 기록을 선택해 복사해 주세요."; btn.hidden = true; dlNS = null; }
        });
      };
    };
    if (dlChecked) { show(); return; }
    try {
      if (window.claude && typeof window.claude.use === "function") {
        window.claude.use("downloads").then(function (ns) { dlNS = ns; dlChecked = true; show(); }, function () { dlChecked = true; });
      } else dlChecked = true;
    } catch (e) { dlChecked = true; }
  }

  /* ── 목차 패널 ── */
  var drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim"), btnToc = document.getElementById("btnToc");
  function buildToc() {
    var h = "";
    PARTS.forEach(function (P, pi) {
      h += '<div class="grp"><div class="gh">' + P.key + ' <span>' + P.name + '</span></div>';
      U.forEach(function (u, i) {
        if (u.part !== pi + 1) return;
        h += '<button class="toc-item" data-i="' + i + '"><span class="n">' + u.no + '</span><span>' + u.title + '</span><span class="st"></span></button>';
      });
      h += '</div>';
    });
    document.getElementById("tocList").innerHTML = h;
    document.querySelectorAll(".toc-item").forEach(function (b) {
      b.addEventListener("click", function () { closeToc(); go(parseInt(b.dataset.i, 10)); });
    });
  }
  function paintToc() {
    document.querySelectorAll(".toc-item").forEach(function (b) {
      var i = parseInt(b.dataset.i, 10), u = U[i], st = b.querySelector(".st"), done = unitDone(u);
      b.classList.toggle("cur", i === cur);
      if (u.practice) { st.textContent = done ? "실습 완료" : "실습"; }
      else { st.textContent = done ? "읽음" : ""; }
      st.classList.toggle("done", done);
    });
  }
  function openToc() { paintToc(); drawer.classList.add("open"); scrim.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); btnToc.setAttribute("aria-expanded", "true"); var c = drawer.querySelector(".toc-item.cur") || drawer.querySelector(".toc-item"); if (c) { c.scrollIntoView({ block: "center" }); c.focus(); } }
  function closeToc() { drawer.classList.remove("open"); scrim.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); btnToc.setAttribute("aria-expanded", "false"); }
  btnToc.addEventListener("click", openToc);
  document.getElementById("btnClose").addEventListener("click", function () { closeToc(); btnToc.focus(); });
  scrim.addEventListener("click", closeToc);

  /* ── 이동 ── */
  var prev = document.getElementById("btnPrev"), next = document.getElementById("btnNext"), posTxt = document.getElementById("posTxt");
  function go(i) {
    if (i === -1) location.hash = "start";
    else if (i === -2) location.hash = "answers";
    else location.hash = "p" + U[i].no;
  }
  function route() {
    var hs = location.hash.replace("#", "");
    var i = -1;
    if (hs === "answers") i = -2;
    else if (/^p\d+$/.test(hs)) {
      var n = parseInt(hs.slice(1), 10);
      for (var k = 0; k < U.length; k++) if (U[k].no === n) { i = k; break; }
    }
    cur = i;
    if (i === -1) renderStart();
    else if (i === -2) renderAnswers();
    else renderUnit(i);
    paint();
    window.scrollTo(0, 0);
  }
  function paint() {
    var part = cur >= 0 ? U[cur].part : 0;
    paintRail(part); paintToc();
    if (cur >= 0) {
      posTxt.innerHTML = '<b>' + U[cur].no + '</b>쪽 / ' + TOTAL;
      prev.disabled = false; next.disabled = cur >= U.length - 1;
      next.lastChild && (next.firstChild.textContent = cur >= U.length - 1 ? "끝" : "다음");
    } else if (cur === -1) {
      posTxt.innerHTML = '<b>시작</b>';
      prev.disabled = true; next.disabled = false; next.firstChild.textContent = "다음";
    } else {
      posTxt.innerHTML = '<b>나의 기록</b>';
      prev.disabled = false; next.disabled = true;
    }
  }
  prev.addEventListener("click", function () {
    if (cur > 0) go(cur - 1); else if (cur === 0) go(-1); else if (cur === -2) go(S.pos >= 0 ? S.pos : -1);
  });
  next.addEventListener("click", function () {
    if (cur === -1) go(S.pos >= 0 ? S.pos : 0); else if (cur >= 0 && cur < U.length - 1) go(cur + 1);
  });
  document.getElementById("btnHome").addEventListener("click", function () { go(-1); });
  document.getElementById("btnAns").addEventListener("click", function () { go(-2); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && drawer.classList.contains("open")) { closeToc(); btnToc.focus(); return; }
    var tg = e.target && e.target.tagName;
    if (tg === "TEXTAREA" || tg === "INPUT") return;
    if (e.key === "ArrowRight" && !next.disabled) next.click();
    if (e.key === "ArrowLeft" && !prev.disabled) prev.click();
  });
  window.addEventListener("hashchange", route);

  /* 복사 상자 · 첨부2 아윤채 웹교재의 요청문 복사와 같은 동작 */
  function selectPre(pre) { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest(".cpy-b") : null;
    if (!b) return;
    var pre = b.closest(".cpy").querySelector("pre.pbox");
    var done = function () { b.classList.add("done"); b.textContent = "복사됨"; setTimeout(function () { b.classList.remove("done"); b.textContent = "복사"; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(pre.textContent).then(done, function () { selectPre(pre); });
    else selectPre(pre);
  });

  buildToc();
  route();
  setupDownload();
})();
</script>
</body>
</html>
